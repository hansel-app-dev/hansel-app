services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hansel
      POSTGRES_USER: hansel
      POSTGRES_PASSWORD: hansel
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hansel']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
