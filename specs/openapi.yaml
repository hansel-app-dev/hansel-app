components:
  parameters:
    ExternalProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, microsoft, apple]
  responses:
    ExternalCallbackRedirect:
      description: One-time callback consumed; redirect to a closed Hansel destination or generic categorical login failure
      headers:
        Location:
          required: true
          schema:
            oneOf:
              - $ref: '#/components/schemas/LoginDestination'
              - type: string
                enum:
                  - /login?error=authentication_failed
                  - /login?error=provider_unavailable
  securitySchemes:
    microsoftPending:
      type: apiKey
      in: cookie
      name: hansel_microsoft_pending
    onboardingContinuation:
      type: apiKey
      in: cookie
      name: hansel_onboarding
    onboardingCsrfCookie:
      type: apiKey
      in: cookie
      name: hansel_onboarding_csrf
    applicationAccess:
      type: apiKey
      in: cookie
      name: hansel_access
    applicationRefresh:
      type: apiKey
      in: cookie
      name: hansel_refresh
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    LoginDestination:
      type: string
      enum:
        - /dashboard
        - /onboarding/verify-email
        - /onboarding/about-you
        - /onboarding/plan-selection
        - /onboarding/payment
        - /onboarding/organization-profile
        - /onboarding/discovery
    LoginResponse:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination: { $ref: '#/components/schemas/LoginDestination' }
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordRecoveryRequestResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: accepted }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, code, password]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
        password: { type: string, minLength: 15, maxLength: 128 }
    PasswordResetFormRequest:
      allOf:
        - $ref: '#/components/schemas/PasswordResetRequest'
        - type: object
          required: [confirmPassword]
          properties:
            confirmPassword: { type: string, minLength: 15, maxLength: 128 }
      unevaluatedProperties: false
    PasswordResetResponse:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination: { type: string, const: /login }
    InvalidRequestError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: invalid_request }
    PasswordRecoveryUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: password_recovery_unavailable }
    PasswordResetRejectedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: password_reset_rejected }
    PasswordResetUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: password_reset_unavailable }
    CreateOnboardingAccountRequest:
      type: object
      additionalProperties: false
      required: [email, password, acceptsTerms, termsVersion, privacyVersion]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 15
          maxLength: 128
        acceptsTerms:
          type: boolean
          const: true
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyVersion:
          type: string
          minLength: 1
          maxLength: 100
    CreateOnboardingAccountResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          enum: [verify-email, login]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        correlationId:
          type: string
          format: uuid
    SitesErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            [
              authentication_required,
              forbidden,
              invalid_request,
              not_found,
              site_not_found,
              sites_conflict,
              sites_forbidden,
              sites_paid_seat_required,
              sites_unavailable,
              sites_upgrade_required,
              allocation_plans_forbidden,
              allocation_plans_conflict,
              allocation_plan_upload_rejected,
              allocation_plans_unavailable,
            ]
    AllocationPlan:
      type: object
      additionalProperties: false
      anyOf:
        - required: [name, files]
        - required: [filename, mediaType, byteSize]
      required: [id, createdAt, modifiedAt, uploadedBy]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 400 }
        files:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, filename, mediaType, byteSize]
            properties:
              id: { type: string, format: uuid }
              filename: { type: string, minLength: 1, maxLength: 255 }
              mediaType:
                { type: string, enum: [image/png, image/jpeg, application/pdf] }
              byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mediaType:
          { type: string, enum: [image/png, image/jpeg, application/pdf] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        createdAt: { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }
        uploadedBy: { type: string, minLength: 1, maxLength: 201 }
    AllocationPlansResponse:
      type: object
      additionalProperties: false
      required: [canAddPlans, plans]
      properties:
        canAddPlans: { type: boolean }
        plans:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/AllocationPlan' }
    AllocationPlanUploadFile:
      type: object
      additionalProperties: false
      required: [filename, mediaType, byteSize, checksumSha256]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        mediaType:
          { type: string, enum: [image/png, image/jpeg, application/pdf] }
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }
        checksumSha256: { type: string, pattern: '^[A-Za-z0-9+/]{43}=$' }
    CreateAllocationPlanUploadBatchRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, files]
      properties:
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
        files:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/AllocationPlanUploadFile' }
    CreateAllocationPlanUploadBatchResponse:
      type: object
      additionalProperties: false
      required: [uploads]
      properties:
        uploads:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [uploadId, uploadUrl, expiresAt, headers]
            properties:
              uploadId: { type: string, format: uuid }
              uploadUrl: { type: string, format: uri }
              expiresAt: { type: string, format: date-time }
              headers:
                type: object
                additionalProperties: false
                required: [content-type, x-amz-checksum-sha256]
                properties:
                  content-type:
                    {
                      type: string,
                      enum: [image/png, image/jpeg, application/pdf],
                    }
                  x-amz-checksum-sha256:
                    { type: string, pattern: '^[A-Za-z0-9+/]{43}=$' }
    VerifyOnboardingEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
    VerifyOnboardingEmailResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: personal-profile
    ResendOnboardingVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResendOnboardingVerificationResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted
    PersonalProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, jobTitle, department]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        jobTitle:
          type: string
          enum:
            [
              manager,
              facility_manager,
              project_manager,
              in_house_designer,
              signage_wayfinding_designer,
              other,
            ]
        jobTitleOther: { type: string, minLength: 1, maxLength: 100 }
        department:
          type: string
          enum:
            [
              marketing_communications,
              development_advancement,
              facilities_management_campus_maintenance,
              other,
            ]
        departmentOther: { type: string, minLength: 1, maxLength: 100 }
      allOf:
        - if:
            properties: { jobTitle: { const: other } }
          then: { required: [jobTitleOther] }
          else: { not: { required: [jobTitleOther] } }
        - if:
            properties: { department: { const: other } }
          then: { required: [departmentOther] }
          else: { not: { required: [departmentOther] } }
    PersonalProfileResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: plan-selection
    PersonalProfilePageResponse:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          oneOf:
            - $ref: '#/components/schemas/PersonalProfileRequest'
            - type: 'null'
    PlanSelectionRequest:
      type: object
      additionalProperties: false
      required: [priceId]
      properties:
        priceId:
          type: string
          enum:
            [
              free,
              plus_monthly,
              plus_annual,
              pro_monthly,
              pro_annual,
              enterprise,
            ]
    PlanDisplayEntry:
      type: object
      additionalProperties: false
      required:
        [
          priceId,
          planId,
          displayName,
          description,
          features,
          billingInterval,
          currency,
          amountMinor,
          monthlyEquivalentMinor,
          additionalSiteAmountMinor,
          paymentRequired,
          maximumSites,
          contactSales,
        ]
      properties:
        priceId:
          {
            type: string,
            enum:
              [
                free,
                plus_monthly,
                plus_annual,
                pro_monthly,
                pro_annual,
                enterprise,
              ],
          }
        planId: { type: string, enum: [free, plus, pro, enterprise] }
        displayName: { type: string }
        description: { type: string }
        features:
          { type: array, minItems: 3, maxItems: 3, items: { type: string } }
        billingInterval:
          { type: [string, 'null'], enum: [monthly, annual, null] }
        currency: { type: string, const: USD }
        amountMinor: { type: [integer, 'null'], minimum: 0 }
        monthlyEquivalentMinor: { type: [integer, 'null'], minimum: 0 }
        additionalSiteAmountMinor: { type: [integer, 'null'], minimum: 0 }
        paymentRequired: { type: boolean }
        maximumSites: { type: [integer, 'null'], minimum: 1 }
        contactSales: { type: boolean }
    PlanSelectionPageResponse:
      type: object
      additionalProperties: false
      required: [firstName, selectedInterval, selectedPriceId, plans]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        selectedInterval: { type: string, enum: [monthly, annual] }
        selectedPriceId:
          {
            type: [string, 'null'],
            enum:
              [
                free,
                plus_monthly,
                plus_annual,
                pro_monthly,
                pro_annual,
                enterprise,
                null,
              ],
          }
        plans:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/PlanDisplayEntry' }
    PlanSelectionResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [nextStep]
          properties: { nextStep: { type: string, const: payment } }
        - type: object
          additionalProperties: false
          required: [nextStep]
          properties:
            { nextStep: { type: string, const: organization-profile } }
        - type: object
          additionalProperties: false
          required: [nextStep, destination]
          properties:
            nextStep: { type: string, const: contact-sales }
            destination: { type: string, format: uri, pattern: '^https://' }
    OrganizationOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
    OrganizationProfileValues:
      type: object
      required:
        [organizationName, country, industry, placeService, organizationSize]
      properties:
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        country:
          type: string
          pattern: '^(AD|AE|AF|AG|AI|AL|AM|AO|AQ|AR|AS|AT|AU|AW|AX|AZ|BA|BB|BD|BE|BF|BG|BH|BI|BJ|BL|BM|BN|BO|BQ|BR|BS|BT|BV|BW|BY|BZ|CA|CC|CD|CF|CG|CH|CI|CK|CL|CM|CN|CO|CR|CU|CV|CW|CX|CY|CZ|DE|DJ|DK|DM|DO|DZ|EC|EE|EG|EH|ER|ES|ET|FI|FJ|FK|FM|FO|FR|GA|GB|GD|GE|GF|GG|GH|GI|GL|GM|GN|GP|GQ|GR|GS|GT|GU|GW|GY|HK|HM|HN|HR|HT|HU|ID|IE|IL|IM|IN|IO|IQ|IR|IS|IT|JE|JM|JO|JP|KE|KG|KH|KI|KM|KN|KP|KR|KW|KY|KZ|LA|LB|LC|LI|LK|LR|LS|LT|LU|LV|LY|MA|MC|MD|ME|MF|MG|MH|MK|ML|MM|MN|MO|MP|MQ|MR|MS|MT|MU|MV|MW|MX|MY|MZ|NA|NC|NE|NF|NG|NI|NL|NO|NP|NR|NU|NZ|OM|PA|PE|PF|PG|PH|PK|PL|PM|PN|PR|PS|PT|PW|PY|QA|RE|RO|RS|RU|RW|SA|SB|SC|SD|SE|SG|SH|SI|SJ|SK|SL|SM|SN|SO|SR|SS|ST|SV|SX|SY|SZ|TC|TD|TF|TG|TH|TJ|TK|TL|TM|TN|TO|TR|TT|TV|TW|TZ|UA|UG|UM|US|UY|UZ|VA|VC|VE|VG|VI|VN|VU|WF|WS|YE|YT|ZA|ZM|ZW)$'
        industry:
          type: string
          enum:
            [
              healthcare,
              education,
              retail,
              corporate_commercial,
              transport_infrastructure,
              government_civic,
              construction_industrial,
              hospitality_tourism,
              sports_entertainment,
              exhibitions_events,
            ]
        placeService:
          type: string
          description: Must be one of the approved place/service identifiers belonging to the submitted industry; the server enforces the industry-to-place catalog relationship.
          enum:
            [
              hospitals,
              clinics,
              aged_care_facilities,
              universities_schools,
              shopping_malls,
              department_stores,
              retail_stores,
              office_buildings,
              coworking_spaces,
              business_parks,
              headquarters,
              airports,
              train_metro_bus_ferry,
              parking_structures,
              council_buildings,
              public_libraries,
              community_centers,
              courthouses,
              licensing_service_centers,
              community_halls,
              construction_sites,
              warehouses,
              manufacturing_plants,
              logistics_hubs,
              mining_operations,
              hotels_resorts,
              hostels_lodges,
              museums_galleries,
              tourist_attractions,
              information_centers,
              stadiums_arenas,
              convention_centers,
              amusement_parks,
              exhibitions,
              trade_shows_conferences,
            ]
        organizationSize:
          type: string
          enum:
            [
              employees_1_10,
              employees_11_50,
              employees_51_100,
              employees_over_100,
            ]
    OrganizationProfileRequest:
      allOf:
        - $ref: '#/components/schemas/OrganizationProfileValues'
        - type: object
          required: [submissionKey]
          properties:
            submissionKey: { type: string, minLength: 32, maxLength: 200 }
      unevaluatedProperties: false
    OrganizationProfilePageResponse:
      type: object
      additionalProperties: false
      required: [submissionKey, countries, industries, placesByIndustry, sizes]
      properties:
        submissionKey: { type: string, minLength: 32, maxLength: 200 }
        countries:
          type: array
          minItems: 249
          maxItems: 249
          items: { $ref: '#/components/schemas/OrganizationOption' }
        industries:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: '#/components/schemas/OrganizationOption' }
        placesByIndustry:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items: { $ref: '#/components/schemas/OrganizationOption' }
        sizes:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/OrganizationOption' }
        profile:
          allOf:
            - $ref: '#/components/schemas/OrganizationProfileValues'
          unevaluatedProperties: false
    OrganizationProfileResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep: { type: string, const: discovery }
    DiscoveryRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, currentManagement, submissionKey]
          properties:
            action: { type: string, const: submit }
            currentManagement:
              type: string
              enum: [pdf, spreadsheet, other]
            currentManagementOther:
              type: string
              minLength: 1
              maxLength: 100
            challenges:
              type: string
              minLength: 1
              maxLength: 1000
            submissionKey: { type: string, minLength: 32, maxLength: 200 }
          if:
            properties:
              currentManagement: { const: other }
          then:
            required: [currentManagementOther]
          else:
            not:
              required: [currentManagementOther]
        - type: object
          additionalProperties: false
          required: [action, submissionKey]
          properties:
            action: { type: string, const: skip }
            submissionKey: { type: string, minLength: 32, maxLength: 200 }
    DiscoveryPageResponse:
      type: object
      additionalProperties: false
      required: [submissionKey, methods]
      properties:
        submissionKey: { type: string, minLength: 32, maxLength: 200 }
        methods:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/OrganizationOption' }
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required: [nextStep, destination]
      properties:
        nextStep: { type: string, const: dashboard }
        destination: { type: string, const: /dashboard }
    DashboardResponse:
      type: object
      additionalProperties: false
      required: [viewer]
      properties:
        viewer:
          type: object
          additionalProperties: false
          required: [displayName, initials, roleLabel]
          properties:
            displayName: { type: string, minLength: 1, maxLength: 201 }
            initials: { type: string, minLength: 1, maxLength: 2 }
            roleLabel: { type: string, minLength: 1, maxLength: 100 }
            email: { type: string, format: email, maxLength: 254 }
        organization:
          type: object
          additionalProperties: false
          required: [name, planDisplayName]
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            planDisplayName: { type: string, minLength: 1, maxLength: 100 }
    SiteRole:
      type: string
      enum: [ADMINISTRATOR, EDITOR, VIEWER]
    SiteAssignment:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/SiteRole' }
    SiteAccessScope:
      type: string
      enum: [ORGANIZATION, PEOPLE_INVITED, PRIVATE]
    OrganizationCreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, accessScope, organizationAccess, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        accessScope: { type: string, const: ORGANIZATION }
        organizationAccess:
          type: string
          enum: [VIEW_COMMENT, EDIT_MANAGE]
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    PeopleInvitedCreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, accessScope, assignments, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        accessScope: { type: string, const: PEOPLE_INVITED }
        assignments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SiteAssignment' }
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    PrivateCreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, accessScope, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        accessScope: { type: string, const: PRIVATE }
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    CreateSiteRequest:
      oneOf:
        - $ref: '#/components/schemas/OrganizationCreateSiteRequest'
        - $ref: '#/components/schemas/PeopleInvitedCreateSiteRequest'
        - $ref: '#/components/schemas/PrivateCreateSiteRequest'
      discriminator:
        propertyName: accessScope
        mapping:
          ORGANIZATION: '#/components/schemas/OrganizationCreateSiteRequest'
          PEOPLE_INVITED: '#/components/schemas/PeopleInvitedCreateSiteRequest'
          PRIVATE: '#/components/schemas/PrivateCreateSiteRequest'
    LegacyCreateSiteRequest:
      deprecated: true
      description: Accepted only during the bounded site-access-scope rollout window and mapped to Organization scope.
      type: object
      additionalProperties: false
      required: [name, organizationAccess, assignments, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        organizationAccess:
          type: string
          enum: [VIEW_COMMENT, EDIT_MANAGE]
        assignments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SiteAssignment' }
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    CreateSiteResponse:
      type: object
      additionalProperties: false
      required: [siteId, destination]
      properties:
        siteId: { type: string, format: uuid }
        destination:
          type: string
          pattern: '^/sites/[0-9a-f-]{36}/activity$'
    SiteMemberChoice:
      type: object
      additionalProperties: false
      required: [email, displayName, initials]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 201 }
        initials: { type: string, minLength: 1, maxLength: 2 }
    SiteSummary:
      type: object
      additionalProperties: false
      required: [id, name, createdAt, updatedAt, memberCount, memberPreview]
      properties:
        hasCoverImage: { type: boolean }
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        memberCount: { type: integer, minimum: 0 }
        memberPreview:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [displayName, initials]
            properties:
              displayName: { type: string, minLength: 1, maxLength: 201 }
              initials: { type: string, minLength: 1, maxLength: 2 }
    SitesPageResponse:
      type: object
      additionalProperties: false
      required:
        [
          organizationName,
          canCreateSite,
          canInviteMembers,
          creator,
          siteLimitReached,
          maximumSites,
          members,
          sites,
        ]
      properties:
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        canCreateSite: { type: boolean }
        siteCoverImageEnabled: { type: boolean }
        canInviteMembers: { type: boolean }
        creator: { $ref: '#/components/schemas/SiteMemberChoice' }
        siteLimitReached: { type: boolean }
        maximumSites: { type: [integer, 'null'], minimum: 1 }
        members:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/SiteMemberChoice' }
        sites:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/SiteSummary' }
    SiteActivityResponse:
      type: object
      additionalProperties: false
      required: [site]
      properties:
        site:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, minLength: 1, maxLength: 100 }
    SiteActivityActor:
      type: object
      additionalProperties: false
      required: [displayName, initials]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 201 }
        initials: { type: string, minLength: 1, maxLength: 2 }
    SiteActivityItem:
      oneOf:
        - type: object
          additionalProperties: false
          required: [id, kind, actor, createdAt, subjectLabel]
          properties:
            id: { type: string, format: uuid }
            kind:
              enum:
                [
                  SITE_CREATED,
                  ALLOCATION_PLAN_ADDED,
                  SIGN_TYPE_CREATED,
                  SIGN_TYPE_RENAMED,
                  SIGN_CREATED,
                  SIGN_UPDATED,
                ]
            actor: { $ref: '#/components/schemas/SiteActivityActor' }
            subjectLabel: { type: string, minLength: 1, maxLength: 255 }
            createdAt: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [id, kind, actor, createdAt, commentText]
          properties:
            id: { type: string, format: uuid }
            kind: { const: SITE_COMMENT_ADDED }
            actor: { $ref: '#/components/schemas/SiteActivityActor' }
            commentText: { type: string, minLength: 1, maxLength: 2000 }
            createdAt: { type: string, format: date-time }
    SiteActivityPageResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SiteActivityItem' }
        nextCursor: { type: [string, 'null'] }
    CreateSiteCommentRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
    Sign:
      type: object
      additionalProperties: false
      required:
        [
          id,
          signTypeId,
          code,
          quantity,
          location,
          content,
          comments,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        signTypeId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 40 }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        location: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 200 }
        comments: { type: string, maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SignType:
      type: object
      additionalProperties: false
      required: [id, name, color, createdAt, updatedAt, quantityTotal, signs]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        color: { enum: [SLATE, RED, TEAL] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        quantityTotal: { type: integer, minimum: 0 }
        signs: { type: array, items: { $ref: '#/components/schemas/Sign' } }
    SignageScheduleResponse:
      type: object
      additionalProperties: false
      required: [canManageSigns, signTypes]
      properties:
        canManageSigns: { type: boolean }
        signTypes:
          { type: array, items: { $ref: '#/components/schemas/SignType' } }
    CreateSignRequest:
      type: object
      additionalProperties: false
      required: [code, quantity, location, content, comments]
      properties:
        code: { type: string, minLength: 1, maxLength: 40 }
        quantity: { type: integer, minimum: 1, maximum: 9999 }
        location: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 200 }
        comments: { type: string, maxLength: 1000 }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
