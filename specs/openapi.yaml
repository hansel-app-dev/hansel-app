openapi: 3.1.0
info:
  title: Hansel API
  version: 0.1.0
paths:
  /onboarding/about-you:
    get:
      operationId: renderOnboardingPersonalProfile
      summary: Render the progressive personal-profile form
      responses:
        '200':
          description: Accessible HTML form that remains usable without JavaScript
          content:
            text/html:
              schema: { type: string }
  /onboarding/plan-selection:
    get:
      operationId: renderOnboardingPlanSelection
      summary: Render the progressive plan-selection form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible private HTML form that remains usable without JavaScript
          content:
            text/html:
              schema: { type: string }
        '401':
          description: The onboarding continuation is unavailable
          content:
            text/html:
              schema: { type: string }
  /api/onboarding/accounts:
    post:
      operationId: createOnboardingAccount
      summary: Begin email and password onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnboardingAccountRequest'
      responses:
        '202':
          description: The generic verification step is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingAccountResponse'
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      operationId: getHealth
      summary: Report API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/onboarding/email-verification/verify:
    post:
      operationId: verifyOnboardingEmail
      summary: Verify the current onboarding email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOnboardingEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOnboardingEmailResponse'
        '400':
          description: Invalid request or generic verification failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/onboarding/email-verification/resend:
    post:
      operationId: resendOnboardingVerification
      summary: Accept a replacement verification-code request generically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOnboardingVerificationRequest'
      responses:
        '202':
          description: Request accepted without revealing account state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOnboardingVerificationResponse'
  /api/onboarding/personal-profile:
    post:
      operationId: submitOnboardingPersonalProfile
      summary: Save the verified user's personal profile and advance onboarding
      description: This server-authoritative transition is single-use. A retry after an accepted or otherwise incompatible transition receives 409, and the client must resume from server-authoritative journey state; an idempotency key is not accepted for this step.
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for application/json requests and must match the credential-bound CSRF cookie. Native HTML form submissions use that cookie directly.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonalProfileRequest'
      responses:
        '200':
          description: Personal profile saved and plan selection is next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalProfileResponse'
        '303':
          description: Native HTML form submission accepted; continue to plan selection
          headers:
            Location:
              required: true
              schema:
                type: string
                const: /onboarding/plan-selection
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
        '401':
          description: The onboarding continuation is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
        '409':
          description: The server-authoritative onboarding transition was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
  /api/onboarding/plan-selection:
    get:
      operationId: getOnboardingPlanSelection
      summary: Load the server-authoritative plan catalog and current selection
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Private plan-selection page state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSelectionPageResponse'
        '401':
          description: The onboarding continuation is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The server-authoritative onboarding transition was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: selectOnboardingPlan
      summary: Persist a plan snapshot and advance onboarding
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for JSON requests; native forms use the credential-bound CSRF cookie.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanSelectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanSelectionRequest'
      responses:
        '200':
          description: Selected plan and server-authored next step
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSelectionResponse'
        '303':
          description: Native form accepted; continue to payment, organization profile, or sales
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
        '401':
          description: The onboarding continuation is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
        '409':
          description: The server-authoritative onboarding transition was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
components:
  securitySchemes:
    onboardingContinuation:
      type: apiKey
      in: cookie
      name: hansel_onboarding
    onboardingCsrfCookie:
      type: apiKey
      in: cookie
      name: hansel_onboarding_csrf
  schemas:
    CreateOnboardingAccountRequest:
      type: object
      additionalProperties: false
      required: [email, password, acceptsTerms, termsVersion, privacyVersion]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 15
          maxLength: 128
        acceptsTerms:
          type: boolean
          const: true
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyVersion:
          type: string
          minLength: 1
          maxLength: 100
    CreateOnboardingAccountResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: verify-email
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        correlationId:
          type: string
          format: uuid
    VerifyOnboardingEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
    VerifyOnboardingEmailResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: personal-profile
    ResendOnboardingVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResendOnboardingVerificationResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted
    PersonalProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, jobTitle, department]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        jobTitle:
          type: string
          enum:
            [
              manager,
              facility_manager,
              project_manager,
              in_house_designer,
              signage_wayfinding_designer,
              other,
            ]
        jobTitleOther: { type: string, minLength: 1, maxLength: 100 }
        department:
          type: string
          enum:
            [
              marketing_communications,
              development_advancement,
              facilities_management_campus_maintenance,
              other,
            ]
        departmentOther: { type: string, minLength: 1, maxLength: 100 }
      allOf:
        - if:
            properties: { jobTitle: { const: other } }
          then: { required: [jobTitleOther] }
          else: { not: { required: [jobTitleOther] } }
        - if:
            properties: { department: { const: other } }
          then: { required: [departmentOther] }
          else: { not: { required: [departmentOther] } }
    PersonalProfileResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: plan-selection
    PlanSelectionRequest:
      type: object
      additionalProperties: false
      required: [priceId]
      properties:
        priceId:
          type: string
          enum:
            [
              free,
              plus_monthly,
              plus_annual,
              pro_monthly,
              pro_annual,
              enterprise,
            ]
    PlanDisplayEntry:
      type: object
      additionalProperties: false
      required:
        [
          priceId,
          planId,
          displayName,
          description,
          features,
          billingInterval,
          currency,
          amountMinor,
          monthlyEquivalentMinor,
          additionalSiteAmountMinor,
          paymentRequired,
          maximumSites,
          contactSales,
        ]
      properties:
        priceId:
          {
            type: string,
            enum:
              [
                free,
                plus_monthly,
                plus_annual,
                pro_monthly,
                pro_annual,
                enterprise,
              ],
          }
        planId: { type: string, enum: [free, plus, pro, enterprise] }
        displayName: { type: string }
        description: { type: string }
        features:
          { type: array, minItems: 3, maxItems: 3, items: { type: string } }
        billingInterval:
          { type: [string, 'null'], enum: [monthly, annual, null] }
        currency: { type: string, const: USD }
        amountMinor: { type: [integer, 'null'], minimum: 0 }
        monthlyEquivalentMinor: { type: [integer, 'null'], minimum: 0 }
        additionalSiteAmountMinor: { type: [integer, 'null'], minimum: 0 }
        paymentRequired: { type: boolean }
        maximumSites: { type: [integer, 'null'], minimum: 1 }
        contactSales: { type: boolean }
    PlanSelectionPageResponse:
      type: object
      additionalProperties: false
      required: [firstName, selectedInterval, selectedPriceId, plans]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        selectedInterval: { type: string, enum: [monthly, annual] }
        selectedPriceId:
          {
            type: [string, 'null'],
            enum:
              [
                free,
                plus_monthly,
                plus_annual,
                pro_monthly,
                pro_annual,
                enterprise,
                null,
              ],
          }
        plans:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/PlanDisplayEntry' }
    PlanSelectionResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [nextStep]
          properties: { nextStep: { type: string, const: payment } }
        - type: object
          additionalProperties: false
          required: [nextStep]
          properties:
            { nextStep: { type: string, const: organization-profile } }
        - type: object
          additionalProperties: false
          required: [nextStep, destination]
          properties:
            nextStep: { type: string, const: contact-sales }
            destination: { type: string, format: uri, pattern: '^https://' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
