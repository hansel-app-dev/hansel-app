openapi: 3.1.0
info:
  title: Hansel API
  version: 0.1.0
paths:
  /login:
    get:
      operationId: renderLogin
      summary: Render the progressive login form
      responses:
        '200':
          description: Accessible private HTML login form usable without JavaScript
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            text/html:
              schema: { type: string }
        '404': { description: Login is disabled }
  /api/auth/login:
    post:
      operationId: loginWithPassword
      summary: Authenticate an existing Hansel account with email and password
      description: Scripted requests must send the configured application Origin; ordinary same-origin forms may instead be validated with browser-protected Fetch Metadata at a trusted reverse-proxy boundary. The server selects the account, onboarding state, tenant, membership, session lifetime, and closed destination.
      parameters:
        - name: Origin
          in: header
          required: false
          description: Required for scripted requests; ordinary same-origin forms may instead be validated with browser-protected Fetch Metadata at a trusted reverse-proxy boundary.
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JSON login accepted and the corresponding Hansel cookies are set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '303':
          description: Native form login accepted and redirected to the server-owned destination
          headers:
            Location:
              required: true
              schema: { $ref: '#/components/schemas/LoginDestination' }
        '400': { description: Strict request validation failed }
        '401':
          description: Generic authentication rejection for unknown, invalid, locked, ambiguous, or ineligible credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string, const: authentication_failed }
            text/html:
              schema: { type: string }
        '403': { description: Origin validation failed }
        '404': { description: Login is disabled }
        '503':
          description: Authentication is temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string, const: login_unavailable }
            text/html:
              schema: { type: string }
  /forgot-password:
    get:
      operationId: renderForgotPassword
      summary: Render the progressive password-recovery request form
      responses:
        '200':
          description: Accessible private HTML form usable without JavaScript
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
            Vary: { schema: { type: string } }
          content:
            text/html:
              schema: { type: string }
        '404': { description: Password recovery is disabled }
  /reset-password:
    get:
      operationId: renderResetPassword
      summary: Render the progressive password reset form
      responses:
        '200':
          description: Accessible private HTML form usable without JavaScript
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
            Vary: { schema: { type: string } }
          content:
            text/html:
              schema: { type: string }
        '404': { description: Password recovery is disabled }
  /api/auth/password-recovery/request:
    post:
      operationId: requestPasswordRecovery
      summary: Generically request a one-time password reset code
      description: Always returns the same accepted representation for valid input, regardless of account existence, eligibility, cooldown, or subject rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' }
      responses:
        '202':
          description: Generic accepted result
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PasswordRecoveryRequestResponse' }
        '303':
          description: Native form accepted and redirected to reset entry
          headers:
            Location:
              schema: { type: string, const: '/reset-password?requested=1' }
        '400':
          description: Strict request validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestError' }
        '403': { description: Origin validation failed }
        '404': { description: Password recovery is disabled }
        '503':
          description: Password recovery is temporarily unavailable
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/PasswordRecoveryUnavailableError',
                }
  /api/auth/password-recovery/reset:
    post:
      operationId: resetPassword
      summary: Consume a reset code and replace the Hansel-managed password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PasswordResetFormRequest' }
      responses:
        '200':
          description: Password replaced, all sessions revoked, and no session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResponse' }
        '303':
          description: Native form reset accepted and redirected to login
          headers:
            Location:
              schema: { type: string, const: '/login?password_reset=success' }
        '400':
          description: Strict validation or generic code rejection
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidRequestError'
                  - $ref: '#/components/schemas/PasswordResetRejectedError'
        '403': { description: Origin validation failed }
        '404': { description: Password recovery is disabled }
        '503':
          description: Password reset is temporarily unavailable
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PasswordResetUnavailableError' }
  /auth/start/{provider}:
    get:
      operationId: startExternalLogin
      summary: Start a server-owned external authorization-code login
      parameters:
        - $ref: '#/components/parameters/ExternalProvider'
        - name: intent
          in: query
          required: true
          schema: { type: string, const: login }
      responses:
        '303':
          description: Redirect to the configured provider authorization endpoint, or a categorical login failure
          headers:
            Location:
              required: true
              schema: { type: string, format: uri-reference }
        '404':
          { description: Provider authentication is disabled or unsupported }
  /auth/callback/{provider}:
    get:
      operationId: completeExternalLogin
      summary: Consume a Google or Microsoft external authorization callback
      parameters:
        - $ref: '#/components/parameters/ExternalProvider'
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '303': { $ref: '#/components/responses/ExternalCallbackRedirect' }
        '404':
          { description: Provider authentication is disabled or unsupported }
    post:
      operationId: completeExternalLoginFormPost
      summary: Consume an Apple form-post external authorization callback
      parameters:
        - $ref: '#/components/parameters/ExternalProvider'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string }
                state: { type: string }
                error: { type: string }
                error_description: { type: string }
      responses:
        '303': { $ref: '#/components/responses/ExternalCallbackRedirect' }
        '404':
          { description: Provider authentication is disabled or unsupported }
  /onboarding/about-you:
    get:
      operationId: renderOnboardingPersonalProfile
      summary: Render the progressive personal-profile form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible private HTML form that remains usable without JavaScript
          content:
            text/html:
              schema: { type: string }
        '303':
          description: The onboarding session has expired; onboarding cookies are cleared and the browser returns to onboarding
          headers:
            Location:
              required: true
              schema:
                type: string
                const: /onboarding
  /onboarding/plan-selection:
    get:
      operationId: renderOnboardingPlanSelection
      summary: Render the progressive plan-selection form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible private HTML form that remains usable without JavaScript
          content:
            text/html:
              schema: { type: string }
  /onboarding/organization-profile:
    get:
      operationId: renderOnboardingOrganizationProfile
      summary: Render the private progressive organization-profile form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible HTML form usable without JavaScript
          content:
            text/html:
              schema: { type: string }
        '401':
          description: The onboarding continuation is unavailable
          content:
            text/html:
              schema: { type: string }
  /onboarding/discovery:
    get:
      operationId: renderOnboardingDiscovery
      summary: Render the private progressive discovery form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible HTML form usable without JavaScript
          content:
            text/html:
              schema: { type: string }
        '303':
          description: The continuation is unavailable and the browser returns to onboarding
          headers:
            Location:
              required: true
              schema: { type: string, const: /onboarding }
  /api/onboarding/accounts:
    post:
      operationId: createOnboardingAccount
      summary: Begin email and password onboarding or route an existing account to login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnboardingAccountRequest'
      responses:
        '202':
          description: A new account continues to verification; any existing account continues to login without receiving a verification code or disclosing its verification or journey state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingAccountResponse'
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      operationId: getHealth
      summary: Report API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: Load the current tenant's authenticated dashboard viewer
      security:
        - applicationAccess: []
        - applicationRefresh: []
      responses:
        '200':
          description: Current server-derived viewer identity; a valid refresh credential may be rotated
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            Vary:
              required: true
              description: Includes Cookie because authentication is cookie-derived.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '401':
          description: Generic authentication failure; application cookies are cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/dashboard/logout:
    post:
      operationId: logoutDashboard
      summary: Revoke the current application session and clear its cookies
      description: Accepts no request body. The Origin header must exactly match the configured application origin. Credentials are optional so repeated or cookie-less logout remains idempotent.
      parameters:
        - name: Origin
          in: header
          required: true
          description: Exact trusted application origin used for logout CSRF protection.
          schema:
            type: string
            format: uri
      security:
        - {}
        - applicationAccess: []
        - applicationRefresh: []
      responses:
        '204':
          description: Represented session families are revoked and both HttpOnly, SameSite=Lax application cookies are cleared using their original paths and Secure policy.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            Set-Cookie:
              required: true
              description: Clears hansel_access at / and hansel_refresh at /api/dashboard.
              schema:
                type: array
                items: { type: string }
        '403':
          description: The Origin header is missing or is not the trusted application origin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: The dashboard rollout boundary is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Session revocation is temporarily unavailable; cookies are retained for retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/sites:
    get:
      operationId: listSites
      summary: Load the authenticated tenant's site list and creation context
      security: [{ applicationAccess: [] }]
      responses:
        '200':
          description: Tenant-scoped site summaries and bounded creation choices
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesPageResponse' }
        '401':
          description: Application authentication is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '404':
          description: Sites is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '503':
          description: Sites is temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
    post:
      operationId: createSite
      summary: Create one tenant-owned site and its initial access atomically
      description: The tenant, organization role, plan, site count, existing members, and internal/external classification are derived by the server. Identical retries under one idempotency key return the original site; changed content conflicts. No Stripe operation occurs.
      parameters:
        - name: Origin
          in: header
          required: true
          description: Exact trusted application origin used for CSRF protection.
          schema: { type: string, format: uri }
      security: [{ applicationAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateSiteRequest'
                - $ref: '#/components/schemas/LegacyCreateSiteRequest'
      responses:
        '201':
          description: Site created or an identical request replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSiteResponse' }
        '400':
          description: Strict request validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '401':
          description: Application authentication is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '403':
          description: Origin or organization authorization failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '409':
          description: Plan limit, paid-seat boundary, or idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '404':
          description: Sites is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '503':
          description: Site creation is temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
  /api/sites/{siteId}:
    get:
      operationId: getSiteActivityContext
      summary: Load the minimal authenticated Activity context for one tenant-owned site
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security: [{ applicationAccess: [] }]
      responses:
        '200':
          description: Minimal tenant-scoped site context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivityResponse' }
        '400':
          description: Site identifier is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '401':
          description: Application authentication is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '404':
          description: Sites is disabled or the site is unavailable to the authenticated tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '503':
          description: Site activity is temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
  /api/onboarding/email-verification/verify:
    post:
      operationId: verifyOnboardingEmail
      summary: Verify an initial or eligible onboarding-resumption code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOnboardingEmailRequest'
      responses:
        '200':
          description: A previously unverified account is verified and continues to personal profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOnboardingEmailResponse'
        '400':
          description: Invalid request or generic verification failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/onboarding/email-verification/resend:
    post:
      operationId: resendOnboardingVerification
      summary: Accept an initial or eligible onboarding-resumption code replacement request generically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOnboardingVerificationRequest'
      responses:
        '202':
          description: Request accepted without revealing account state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOnboardingVerificationResponse'
  /api/onboarding/personal-profile:
    get:
      operationId: getOnboardingPersonalProfile
      summary: Load the verified user's server-authoritative personal profile
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: The accepted profile, or null before the first save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalProfilePageResponse'
        '401':
          description: The onboarding session has expired and onboarding cookies are cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: submitOnboardingPersonalProfile
      summary: Save the verified user's personal profile and advance onboarding
      description: The initial save advances the new-organization journey to plan selection. Returning from plan selection permits an edit, and every accepted write rotates the continuation credential. An unavailable or incompatible continuation is cleared and receives the generic expired-session response; an idempotency key is not accepted for this step.
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for application/json requests and must match the credential-bound CSRF cookie. Native HTML form submissions use that cookie directly.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonalProfileRequest'
      responses:
        '200':
          description: Personal profile saved and plan selection is next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalProfileResponse'
        '303':
          description: Native HTML form submission accepted and continues to plan selection, or an expired session is cleared and returns to onboarding
          headers:
            Location:
              required: true
              schema:
                type: string
                enum:
                  - /onboarding/plan-selection
                  - /onboarding
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
        '401':
          description: The JSON onboarding session has expired and onboarding cookies are cleared, or request authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
  /api/onboarding/plan-selection:
    get:
      operationId: getOnboardingPlanSelection
      summary: Load the server-authoritative plan catalog and current selection
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Private plan-selection page state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSelectionPageResponse'
        '401':
          description: The onboarding continuation is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The server-authoritative onboarding transition was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: selectOnboardingPlan
      summary: Persist a plan snapshot and advance onboarding
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanSelectionRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PlanSelectionRequest' }
      responses:
        '200':
          description: Selected plan and server-authored next step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSelectionResponse' }
        '303': { description: Native form accepted }
        '400': { description: Invalid request }
        '401': { description: Continuation unavailable }
        '409': { description: Transition rejected }
  /api/onboarding/organization-profile:
    get:
      operationId: getOnboardingOrganizationProfile
      summary: Load approved organization taxonomies and a server-issued submission key
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Private organization-profile page state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfilePageResponse'
        '401':
          description: The onboarding continuation is unavailable
        '409':
          description: The server-authoritative onboarding transition was rejected
    post:
      operationId: submitOnboardingOrganizationProfile
      summary: Atomically create the organization and sole Owner membership
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for JSON requests; native forms use the credential-bound CSRF cookie.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationProfileRequest'
      responses:
        '200':
          description: Organization created or an equivalent idempotent replay accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfileResponse'
        '303':
          description: Native form accepted; continue to discovery
        '400': { description: The request does not match the contract }
        '401': { description: The onboarding continuation is unavailable }
        '409': { description: Conflicting replay or rejected transition }
  /api/onboarding/discovery:
    get:
      operationId: getOnboardingDiscovery
      summary: Load approved discovery methods and a server-issued submission key
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Private discovery page state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryPageResponse' }
        '401': { description: The onboarding continuation is unavailable }
    post:
      operationId: completeOnboardingDiscovery
      summary: Submit or explicitly skip discovery and complete onboarding
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for JSON requests; native forms use the credential-bound CSRF cookie.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoveryRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DiscoveryRequest' }
      responses:
        '200':
          description: Onboarding completed or an equivalent idempotent replay accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResponse' }
        '303':
          description: Native form accepted and redirected to the organization dashboard
          headers:
            Location:
              required: true
              schema: { type: string, const: /dashboard }
        '400': { description: The request does not match the contract }
        '401': { description: The onboarding continuation is unavailable }
        '409': { description: Conflicting replay or rejected transition }
components:
  parameters:
    ExternalProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, microsoft, apple]
  responses:
    ExternalCallbackRedirect:
      description: One-time callback consumed; redirect to a closed Hansel destination or generic categorical login failure
      headers:
        Location:
          required: true
          schema:
            oneOf:
              - $ref: '#/components/schemas/LoginDestination'
              - type: string
                enum:
                  - /login?error=authentication_failed
                  - /login?error=provider_unavailable
  securitySchemes:
    onboardingContinuation:
      type: apiKey
      in: cookie
      name: hansel_onboarding
    onboardingCsrfCookie:
      type: apiKey
      in: cookie
      name: hansel_onboarding_csrf
    applicationAccess:
      type: apiKey
      in: cookie
      name: hansel_access
    applicationRefresh:
      type: apiKey
      in: cookie
      name: hansel_refresh
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    LoginDestination:
      type: string
      enum:
        - /dashboard
        - /onboarding/verify-email
        - /onboarding/about-you
        - /onboarding/plan-selection
        - /onboarding/payment
        - /onboarding/organization-profile
        - /onboarding/discovery
    LoginResponse:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination: { $ref: '#/components/schemas/LoginDestination' }
    PasswordRecoveryRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordRecoveryRequestResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: accepted }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, code, password]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: '^\d{6}$' }
        password: { type: string, minLength: 15, maxLength: 128 }
    PasswordResetFormRequest:
      allOf:
        - $ref: '#/components/schemas/PasswordResetRequest'
        - type: object
          required: [confirmPassword]
          properties:
            confirmPassword: { type: string, minLength: 15, maxLength: 128 }
      unevaluatedProperties: false
    PasswordResetResponse:
      type: object
      additionalProperties: false
      required: [destination]
      properties:
        destination: { type: string, const: /login }
    InvalidRequestError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: invalid_request }
    PasswordRecoveryUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: password_recovery_unavailable }
    PasswordResetRejectedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: password_reset_rejected }
    PasswordResetUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, const: password_reset_unavailable }
    CreateOnboardingAccountRequest:
      type: object
      additionalProperties: false
      required: [email, password, acceptsTerms, termsVersion, privacyVersion]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 15
          maxLength: 128
        acceptsTerms:
          type: boolean
          const: true
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyVersion:
          type: string
          minLength: 1
          maxLength: 100
    CreateOnboardingAccountResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          enum: [verify-email, login]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
        correlationId:
          type: string
          format: uuid
    SitesErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum:
            [
              authentication_required,
              forbidden,
              invalid_request,
              not_found,
              site_not_found,
              sites_conflict,
              sites_forbidden,
              sites_paid_seat_required,
              sites_unavailable,
              sites_upgrade_required,
            ]
    VerifyOnboardingEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
    VerifyOnboardingEmailResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: personal-profile
    ResendOnboardingVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResendOnboardingVerificationResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted
    PersonalProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, jobTitle, department]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        jobTitle:
          type: string
          enum:
            [
              manager,
              facility_manager,
              project_manager,
              in_house_designer,
              signage_wayfinding_designer,
              other,
            ]
        jobTitleOther: { type: string, minLength: 1, maxLength: 100 }
        department:
          type: string
          enum:
            [
              marketing_communications,
              development_advancement,
              facilities_management_campus_maintenance,
              other,
            ]
        departmentOther: { type: string, minLength: 1, maxLength: 100 }
      allOf:
        - if:
            properties: { jobTitle: { const: other } }
          then: { required: [jobTitleOther] }
          else: { not: { required: [jobTitleOther] } }
        - if:
            properties: { department: { const: other } }
          then: { required: [departmentOther] }
          else: { not: { required: [departmentOther] } }
    PersonalProfileResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: plan-selection
    PersonalProfilePageResponse:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          oneOf:
            - $ref: '#/components/schemas/PersonalProfileRequest'
            - type: 'null'
    PlanSelectionRequest:
      type: object
      additionalProperties: false
      required: [priceId]
      properties:
        priceId:
          type: string
          enum:
            [
              free,
              plus_monthly,
              plus_annual,
              pro_monthly,
              pro_annual,
              enterprise,
            ]
    PlanDisplayEntry:
      type: object
      additionalProperties: false
      required:
        [
          priceId,
          planId,
          displayName,
          description,
          features,
          billingInterval,
          currency,
          amountMinor,
          monthlyEquivalentMinor,
          additionalSiteAmountMinor,
          paymentRequired,
          maximumSites,
          contactSales,
        ]
      properties:
        priceId:
          {
            type: string,
            enum:
              [
                free,
                plus_monthly,
                plus_annual,
                pro_monthly,
                pro_annual,
                enterprise,
              ],
          }
        planId: { type: string, enum: [free, plus, pro, enterprise] }
        displayName: { type: string }
        description: { type: string }
        features:
          { type: array, minItems: 3, maxItems: 3, items: { type: string } }
        billingInterval:
          { type: [string, 'null'], enum: [monthly, annual, null] }
        currency: { type: string, const: USD }
        amountMinor: { type: [integer, 'null'], minimum: 0 }
        monthlyEquivalentMinor: { type: [integer, 'null'], minimum: 0 }
        additionalSiteAmountMinor: { type: [integer, 'null'], minimum: 0 }
        paymentRequired: { type: boolean }
        maximumSites: { type: [integer, 'null'], minimum: 1 }
        contactSales: { type: boolean }
    PlanSelectionPageResponse:
      type: object
      additionalProperties: false
      required: [firstName, selectedInterval, selectedPriceId, plans]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        selectedInterval: { type: string, enum: [monthly, annual] }
        selectedPriceId:
          {
            type: [string, 'null'],
            enum:
              [
                free,
                plus_monthly,
                plus_annual,
                pro_monthly,
                pro_annual,
                enterprise,
                null,
              ],
          }
        plans:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/PlanDisplayEntry' }
    PlanSelectionResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [nextStep]
          properties: { nextStep: { type: string, const: payment } }
        - type: object
          additionalProperties: false
          required: [nextStep]
          properties:
            { nextStep: { type: string, const: organization-profile } }
        - type: object
          additionalProperties: false
          required: [nextStep, destination]
          properties:
            nextStep: { type: string, const: contact-sales }
            destination: { type: string, format: uri, pattern: '^https://' }
    OrganizationOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
    OrganizationProfileValues:
      type: object
      required:
        [organizationName, country, industry, placeService, organizationSize]
      properties:
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        country:
          type: string
          pattern: '^(AD|AE|AF|AG|AI|AL|AM|AO|AQ|AR|AS|AT|AU|AW|AX|AZ|BA|BB|BD|BE|BF|BG|BH|BI|BJ|BL|BM|BN|BO|BQ|BR|BS|BT|BV|BW|BY|BZ|CA|CC|CD|CF|CG|CH|CI|CK|CL|CM|CN|CO|CR|CU|CV|CW|CX|CY|CZ|DE|DJ|DK|DM|DO|DZ|EC|EE|EG|EH|ER|ES|ET|FI|FJ|FK|FM|FO|FR|GA|GB|GD|GE|GF|GG|GH|GI|GL|GM|GN|GP|GQ|GR|GS|GT|GU|GW|GY|HK|HM|HN|HR|HT|HU|ID|IE|IL|IM|IN|IO|IQ|IR|IS|IT|JE|JM|JO|JP|KE|KG|KH|KI|KM|KN|KP|KR|KW|KY|KZ|LA|LB|LC|LI|LK|LR|LS|LT|LU|LV|LY|MA|MC|MD|ME|MF|MG|MH|MK|ML|MM|MN|MO|MP|MQ|MR|MS|MT|MU|MV|MW|MX|MY|MZ|NA|NC|NE|NF|NG|NI|NL|NO|NP|NR|NU|NZ|OM|PA|PE|PF|PG|PH|PK|PL|PM|PN|PR|PS|PT|PW|PY|QA|RE|RO|RS|RU|RW|SA|SB|SC|SD|SE|SG|SH|SI|SJ|SK|SL|SM|SN|SO|SR|SS|ST|SV|SX|SY|SZ|TC|TD|TF|TG|TH|TJ|TK|TL|TM|TN|TO|TR|TT|TV|TW|TZ|UA|UG|UM|US|UY|UZ|VA|VC|VE|VG|VI|VN|VU|WF|WS|YE|YT|ZA|ZM|ZW)$'
        industry:
          type: string
          enum:
            [
              healthcare,
              education,
              retail,
              corporate_commercial,
              transport_infrastructure,
              government_civic,
              construction_industrial,
              hospitality_tourism,
              sports_entertainment,
              exhibitions_events,
            ]
        placeService:
          type: string
          description: Must be one of the approved place/service identifiers belonging to the submitted industry; the server enforces the industry-to-place catalog relationship.
          enum:
            [
              hospitals,
              clinics,
              aged_care_facilities,
              universities_schools,
              shopping_malls,
              department_stores,
              retail_stores,
              office_buildings,
              coworking_spaces,
              business_parks,
              headquarters,
              airports,
              train_metro_bus_ferry,
              parking_structures,
              council_buildings,
              public_libraries,
              community_centers,
              courthouses,
              licensing_service_centers,
              community_halls,
              construction_sites,
              warehouses,
              manufacturing_plants,
              logistics_hubs,
              mining_operations,
              hotels_resorts,
              hostels_lodges,
              museums_galleries,
              tourist_attractions,
              information_centers,
              stadiums_arenas,
              convention_centers,
              amusement_parks,
              exhibitions,
              trade_shows_conferences,
            ]
        organizationSize:
          type: string
          enum:
            [
              employees_1_10,
              employees_11_50,
              employees_51_100,
              employees_over_100,
            ]
    OrganizationProfileRequest:
      allOf:
        - $ref: '#/components/schemas/OrganizationProfileValues'
        - type: object
          required: [submissionKey]
          properties:
            submissionKey: { type: string, minLength: 32, maxLength: 200 }
      unevaluatedProperties: false
    OrganizationProfilePageResponse:
      type: object
      additionalProperties: false
      required: [submissionKey, countries, industries, placesByIndustry, sizes]
      properties:
        submissionKey: { type: string, minLength: 32, maxLength: 200 }
        countries:
          type: array
          minItems: 249
          maxItems: 249
          items: { $ref: '#/components/schemas/OrganizationOption' }
        industries:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: '#/components/schemas/OrganizationOption' }
        placesByIndustry:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            items: { $ref: '#/components/schemas/OrganizationOption' }
        sizes:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/OrganizationOption' }
        profile:
          allOf:
            - $ref: '#/components/schemas/OrganizationProfileValues'
          unevaluatedProperties: false
    OrganizationProfileResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep: { type: string, const: discovery }
    DiscoveryRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, currentManagement, submissionKey]
          properties:
            action: { type: string, const: submit }
            currentManagement:
              type: string
              enum: [pdf, spreadsheet, other]
            currentManagementOther:
              type: string
              minLength: 1
              maxLength: 100
            challenges:
              type: string
              minLength: 1
              maxLength: 1000
            submissionKey: { type: string, minLength: 32, maxLength: 200 }
          if:
            properties:
              currentManagement: { const: other }
          then:
            required: [currentManagementOther]
          else:
            not:
              required: [currentManagementOther]
        - type: object
          additionalProperties: false
          required: [action, submissionKey]
          properties:
            action: { type: string, const: skip }
            submissionKey: { type: string, minLength: 32, maxLength: 200 }
    DiscoveryPageResponse:
      type: object
      additionalProperties: false
      required: [submissionKey, methods]
      properties:
        submissionKey: { type: string, minLength: 32, maxLength: 200 }
        methods:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/OrganizationOption' }
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required: [nextStep, destination]
      properties:
        nextStep: { type: string, const: dashboard }
        destination: { type: string, const: /dashboard }
    DashboardResponse:
      type: object
      additionalProperties: false
      required: [viewer]
      properties:
        viewer:
          type: object
          additionalProperties: false
          required: [displayName, initials, roleLabel]
          properties:
            displayName: { type: string, minLength: 1, maxLength: 201 }
            initials: { type: string, minLength: 1, maxLength: 2 }
            roleLabel: { type: string, minLength: 1, maxLength: 100 }
    SiteRole:
      type: string
      enum: [ADMINISTRATOR, EDITOR, VIEWER]
    SiteAssignment:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/SiteRole' }
    SiteAccessScope:
      type: string
      enum: [ORGANIZATION, PEOPLE_INVITED, PRIVATE]
    OrganizationCreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, accessScope, organizationAccess, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        accessScope: { type: string, const: ORGANIZATION }
        organizationAccess:
          type: string
          enum: [VIEW_COMMENT, EDIT_MANAGE]
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    PeopleInvitedCreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, accessScope, assignments, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        accessScope: { type: string, const: PEOPLE_INVITED }
        assignments:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/SiteAssignment' }
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    PrivateCreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name, accessScope, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        accessScope: { type: string, const: PRIVATE }
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    CreateSiteRequest:
      oneOf:
        - $ref: '#/components/schemas/OrganizationCreateSiteRequest'
        - $ref: '#/components/schemas/PeopleInvitedCreateSiteRequest'
        - $ref: '#/components/schemas/PrivateCreateSiteRequest'
      discriminator:
        propertyName: accessScope
        mapping:
          ORGANIZATION: '#/components/schemas/OrganizationCreateSiteRequest'
          PEOPLE_INVITED: '#/components/schemas/PeopleInvitedCreateSiteRequest'
          PRIVATE: '#/components/schemas/PrivateCreateSiteRequest'
    LegacyCreateSiteRequest:
      deprecated: true
      description: Accepted only during the bounded site-access-scope rollout window and mapped to Organization scope.
      type: object
      additionalProperties: false
      required: [name, organizationAccess, assignments, idempotencyKey]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        organizationAccess:
          type: string
          enum: [VIEW_COMMENT, EDIT_MANAGE]
        assignments:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SiteAssignment' }
        idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
    CreateSiteResponse:
      type: object
      additionalProperties: false
      required: [siteId, destination]
      properties:
        siteId: { type: string, format: uuid }
        destination:
          type: string
          pattern: '^/sites/[0-9a-f-]{36}/activity$'
    SiteMemberChoice:
      type: object
      additionalProperties: false
      required: [email, displayName, initials]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 201 }
        initials: { type: string, minLength: 1, maxLength: 2 }
    SiteSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
    SitesPageResponse:
      type: object
      additionalProperties: false
      required:
        [
          organizationName,
          canCreateSite,
          canInviteMembers,
          creator,
          siteLimitReached,
          maximumSites,
          members,
          sites,
        ]
      properties:
        organizationName: { type: string, minLength: 1, maxLength: 200 }
        canCreateSite: { type: boolean }
        canInviteMembers: { type: boolean }
        creator: { $ref: '#/components/schemas/SiteMemberChoice' }
        siteLimitReached: { type: boolean }
        maximumSites: { type: [integer, 'null'], minimum: 1 }
        members:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/SiteMemberChoice' }
        sites:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/SiteSummary' }
    SiteActivityResponse:
      type: object
      additionalProperties: false
      required: [site]
      properties:
        site: { $ref: '#/components/schemas/SiteSummary' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
