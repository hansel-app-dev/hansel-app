openapi: 3.1.0
info:
  title: Hansel API
  version: 0.1.0
paths:
  /api/onboarding/accounts:
    post:
      operationId: createOnboardingAccount
      summary: Begin email and password onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnboardingAccountRequest'
      responses:
        '202':
          description: The generic verification step is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingAccountResponse'
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      operationId: getHealth
      summary: Report API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/onboarding/email-verification/verify:
    post:
      operationId: verifyOnboardingEmail
      summary: Verify the current onboarding email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOnboardingEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOnboardingEmailResponse'
        '400':
          description: Invalid request or generic verification failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/onboarding/email-verification/resend:
    post:
      operationId: resendOnboardingVerification
      summary: Accept a replacement verification-code request generically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOnboardingVerificationRequest'
      responses:
        '202':
          description: Request accepted without revealing account state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOnboardingVerificationResponse'
components:
  schemas:
    CreateOnboardingAccountRequest:
      type: object
      additionalProperties: false
      required: [email, password, acceptsTerms, termsVersion, privacyVersion]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 15
          maxLength: 128
        acceptsTerms:
          type: boolean
          const: true
        termsVersion:
          type: string
          minLength: 1
          maxLength: 100
        privacyVersion:
          type: string
          minLength: 1
          maxLength: 100
    CreateOnboardingAccountResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: verify-email
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    VerifyOnboardingEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
    VerifyOnboardingEmailResponse:
      type: object
      additionalProperties: false
      required: [nextStep]
      properties:
        nextStep:
          type: string
          const: personal-profile
    ResendOnboardingVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResendOnboardingVerificationResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
