openapi: 3.1.0
info:
  title: Hansel API
  version: 0.1.0
paths:
  /api/library-files:
    $ref: './library-files.openapi.yaml#/collection'
  /api/library-files/{fileId}/download:
    $ref: './library-files.openapi.yaml#/download'
  /api/library-files/{fileId}/thumbnail:
    $ref: './library-files.openapi.yaml#/thumbnail'
  /api/sites/{siteId}/library-plans:
    $ref: './library-files.openapi.yaml#/plans'
  /api/sites/{siteId}/signs/{signId}/library-documents:
    $ref: './library-files.openapi.yaml#/documents'
  /api/sites/{siteId}/signs/{signId}/library-photos:
    $ref: './library-files.openapi.yaml#/photos'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments:
    $ref: './plan-comments.openapi.yaml#/collection'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/{threadId}:
    $ref: './plan-comments.openapi.yaml#/history'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/{threadId}/state:
    $ref: './plan-comments.openapi.yaml#/state'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/{threadId}/position:
    $ref: './plan-comments.openapi.yaml#/position'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/people:
    $ref: './plan-comments.openapi.yaml#/people'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/attachments:
    $ref: './plan-comments.openapi.yaml#/attachments'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/attachments/{attachmentId}:
    $ref: './plan-comments.openapi.yaml#/attachment'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/attachments/{attachmentId}/download:
    $ref: './plan-comments.openapi.yaml#/download'
  /api/sites/{siteId}/allocation-plans/{planId}/files/{fileId}/comments/attachments/{attachmentId}/thumbnail:
    $ref: './plan-comments.openapi.yaml#/thumbnail'
  /api/sites/{siteId}/allocation-plans/{planId}/areas:
    $ref: './plan-areas.openapi.yaml#/collection'
  /api/sites/{siteId}/allocation-plans/{planId}/areas/{areaId}:
    $ref: './plan-areas.openapi.yaml#/item'
  /api/auth/microsoft/signup:
    $ref: './microsoft-signup.openapi.yaml#/state'
  /api/auth/microsoft/signup/send:
    $ref: './microsoft-signup.openapi.yaml#/send'
  /api/auth/microsoft/signup/verify:
    $ref: './microsoft-signup.openapi.yaml#/verify'
  /onboarding/microsoft-email:
    $ref: './microsoft-signup.openapi.yaml#/native'
  /auth/microsoft/signup:
    $ref: './microsoft-signup.openapi.yaml#/nativeSubmit'
  /api/sites/{siteId}/signs/{signId}/comments:
    $ref: './sign-comments.openapi.yaml#/collection'
  /api/sites/{siteId}/signs/{signId}/comments/people:
    $ref: './sign-comments.openapi.yaml#/people'
  /api/sites/{siteId}/signs/{signId}/comments/{commentId}/reactions:
    $ref: './sign-comments.openapi.yaml#/reactions'
  /api/sites/{siteId}/signs/{signId}/comments/attachments:
    $ref: './sign-comments.openapi.yaml#/attachments'
  /api/sites/{siteId}/signs/{signId}/comments/attachments/{attachmentId}:
    $ref: './sign-comments.openapi.yaml#/attachment'
  /api/sites/{siteId}/signs/{signId}/comments/attachments/{attachmentId}/download:
    $ref: './sign-comments.openapi.yaml#/download'
  /api/sites/{siteId}/signs/{signId}/comments/attachments/{attachmentId}/thumbnail:
    $ref: './sign-comments.openapi.yaml#/thumbnail'
  /api/sites/{siteId}/signs/{signId}/photos:
    $ref: './sign-photos.openapi.yaml#/collection'
  /api/sites/{siteId}/signs/{signId}/photos/{photoId}:
    $ref: './sign-photos.openapi.yaml#/item'
  /api/sites/{siteId}/signs/{signId}/photos/{photoId}/thumbnail:
    $ref: './sign-photos.openapi.yaml#/thumbnail'
  /api/sites/{siteId}/signs/{signId}/photos/{photoId}/download:
    $ref: './sign-photos.openapi.yaml#/download'
  /api/sites/{siteId}/signs/{signId}/documents:
    $ref: './sign-documents.openapi.yaml#/collection'
  /api/sites/{siteId}/signs/{signId}/documents/{documentId}:
    $ref: './sign-documents.openapi.yaml#/item'
  /api/sites/{siteId}/signs/{signId}/documents/{documentId}/download:
    $ref: './sign-documents.openapi.yaml#/download'
  /api/sites/{siteId}/allocation-plans/{planId}/signs:
    $ref: './plan-signs.openapi.yaml#/collection'
  /api/sites/{siteId}/allocation-plans/{planId}/signs/{signId}:
    $ref: './plan-signs.openapi.yaml#/item'
  /api/sites/{siteId}/allocation-plan-drafts:
    parameters:
      - {
          name: siteId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: createAllocationPlanDraft
      summary: Stage private uploads for one named plan without creating the plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: '#/components/schemas/CreateAllocationPlanUploadBatchRequest',
              }
      responses:
        '201':
          description: Ordered upload intents; session and exact-origin proof required
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/CreateAllocationPlanUploadBatchResponse',
                }
        '400': { description: Invalid manifest }
        '401': { description: Authentication required }
        '403': { description: Forbidden }
        '404': { description: Unavailable site or disabled feature }
        '409': { description: Idempotency conflict }
        '503': { description: Retryable unavailability }
  /api/sites/{siteId}/allocation-plan-drafts/{uploadId}/verify:
    parameters:
      - {
          name: siteId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - {
          name: uploadId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: verifyAllocationPlanDraftFile
      responses:
        '200':
          description: File verified but not attached; session and exact-origin proof required
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uploadId, verified]
                properties:
                  uploadId: { type: string, format: uuid }
                  verified: { type: boolean, const: true }
        '400': { description: Invalid identifier }
        '401': { description: Authentication required }
        '403': { description: Forbidden }
        '404': { description: Upload not found or disabled feature }
        '409': { description: Upload expired or rejected }
        '503': { description: Retryable unavailability }
  /api/sites/{siteId}/allocation-plan-drafts/commit:
    parameters:
      - {
          name: siteId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      operationId: commitAllocationPlanDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, uploadIds, idempotencyKey]
              properties:
                name:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 200,
                    description: 'Trimmed Unicode name, no C0 or DEL controls; duplicate names allowed.',
                  }
                idempotencyKey: { type: string, minLength: 32, maxLength: 200 }
                uploadIds:
                  type: array
                  minItems: 1
                  maxItems: 1
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: One atomic plan and Activity; idempotent replay returns the same plan
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [plan]
                properties:
                  plan: { $ref: '#/components/schemas/AllocationPlan' }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Forbidden }
        '404': { description: Site not found or disabled feature }
        '409': { description: Conflict or expired/unverified/attached file }
        '503': { description: Retryable unavailability }
  /login:
    get:
      operationId: renderLogin
      summary: Render the progressive login form
      responses:
        '200':
          description: Accessible private HTML login form usable without JavaScript
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            text/html:
              schema: { type: string }
        '404': { description: Login is disabled }
  /api/auth/login:
    post:
      operationId: loginWithPassword
      summary: Authenticate an existing Hansel account with email and password
      description: Scripted requests must send the configured application Origin; ordinary same-origin forms may instead be validated with browser-protected Fetch Metadata at a trusted reverse-proxy boundary. The server selects the account, onboarding state, tenant, membership, session lifetime, and closed destination.
      parameters:
        - name: Origin
          in: header
          required: false
          description: Required for scripted requests; ordinary same-origin forms may instead be validated with browser-protected Fetch Metadata at a trusted reverse-proxy boundary.
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JSON login accepted and the corresponding Hansel cookies are set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '303':
          description: Native form login accepted and redirected to the server-owned destination
          headers:
            Location:
              required: true
              schema: { $ref: '#/components/schemas/LoginDestination' }
        '400': { description: Strict request validation failed }
        '401':
          description: Generic authentication rejection for unknown, invalid, locked, ambiguous, or ineligible credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string, const: authentication_failed }
            text/html:
              schema: { type: string }
        '403': { description: Origin validation failed }
        '404': { description: Login is disabled }
        '503':
          description: Authentication is temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string, const: login_unavailable }
            text/html:
              schema: { type: string }
  /forgot-password:
    get:
      operationId: renderForgotPassword
      summary: Render the progressive password-recovery request form
      responses:
        '200':
          description: Accessible private HTML form usable without JavaScript
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
            Vary: { schema: { type: string } }
          content:
            text/html:
              schema: { type: string }
        '404': { description: Password recovery is disabled }
  /reset-password:
    get:
      operationId: renderResetPassword
      summary: Render the progressive password reset form
      responses:
        '200':
          description: Accessible private HTML form usable without JavaScript
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
            Vary: { schema: { type: string } }
          content:
            text/html:
              schema: { type: string }
        '404': { description: Password recovery is disabled }
  /api/auth/password-recovery/request:
    post:
      operationId: requestPasswordRecovery
      summary: Generically request a one-time password reset code
      description: Always returns the same accepted representation for valid input, regardless of account existence, eligibility, cooldown, or subject rate limiting.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' }
      responses:
        '202':
          description: Generic accepted result
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PasswordRecoveryRequestResponse' }
        '303':
          description: Native form accepted and redirected to reset entry
          headers:
            Location:
              schema: { type: string, const: '/reset-password?requested=1' }
        '400':
          description: Strict request validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvalidRequestError' }
        '403': { description: Origin validation failed }
        '404': { description: Password recovery is disabled }
        '503':
          description: Password recovery is temporarily unavailable
          content:
            application/json:
              schema:
                {
                  $ref: '#/components/schemas/PasswordRecoveryUnavailableError',
                }
  /api/auth/password-recovery/reset:
    post:
      operationId: resetPassword
      summary: Consume a reset code and replace the Hansel-managed password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PasswordResetFormRequest' }
      responses:
        '200':
          description: Password replaced, all sessions revoked, and no session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResponse' }
        '303':
          description: Native form reset accepted and redirected to login
          headers:
            Location:
              schema: { type: string, const: '/login?password_reset=success' }
        '400':
          description: Strict validation or generic code rejection
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidRequestError'
                  - $ref: '#/components/schemas/PasswordResetRejectedError'
        '403': { description: Origin validation failed }
        '404': { description: Password recovery is disabled }
        '503':
          description: Password reset is temporarily unavailable
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/PasswordResetUnavailableError' }
  /api/auth/providers:
    get:
      operationId: listEnabledAuthProviders
      summary: Public provider availability without credentials
      responses:
        '200':
          description: Non-cacheable enabled-provider list; empty when disabled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [providers]
                properties:
                  providers:
                    type: array
                    uniqueItems: true
                    maxItems: 3
                    items: { type: string, enum: [google, microsoft, apple] }
  /auth/start/{provider}:
    post:
      operationId: startExternalOnboarding
      summary: Start browser-bound onboarding with current server-owned policy consent
      parameters:
        - $ref: '#/components/parameters/ExternalProvider'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [intent, acceptsTerms]
              properties:
                intent: { type: string, const: onboarding }
                acceptsTerms: { type: string, const: 'true' }
      responses:
        '303':
          {
            description: Provider redirect with short-lived HttpOnly transaction cookie,
            or safe failure,
          }
        '400': { description: Unexpected form fields }
        '403': { description: Same-origin consent required }
        '404': { description: Provider disabled or unsupported intent }
    get:
      operationId: startExternalLogin
      summary: Start a server-owned external authorization-code login
      parameters:
        - $ref: '#/components/parameters/ExternalProvider'
        - name: intent
          in: query
          required: true
          schema: { type: string, const: login }
      responses:
        '303':
          description: Redirect to the configured provider authorization endpoint, or a categorical login failure
          headers:
            Location:
              required: true
              schema: { type: string, format: uri-reference }
        '404':
          { description: Provider authentication is disabled or unsupported }
  /auth/callback/{provider}:
    get:
      operationId: completeExternalLogin
      summary: Consume a Google or Microsoft external authorization callback
      parameters:
        - $ref: '#/components/parameters/ExternalProvider'
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string, format: uri } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '303': { $ref: '#/components/responses/ExternalCallbackRedirect' }
        '404':
          { description: Provider authentication is disabled or unsupported }
    post:
      operationId: completeExternalLoginFormPost
      summary: Consume an Apple form-post external authorization callback
      parameters:
        - $ref: '#/components/parameters/ExternalProvider'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string }
                state: { type: string }
                iss: { type: string, format: uri }
                error: { type: string }
                error_description: { type: string }
      responses:
        '303': { $ref: '#/components/responses/ExternalCallbackRedirect' }
        '404':
          { description: Provider authentication is disabled or unsupported }
  /onboarding/about-you:
    get:
      operationId: renderOnboardingPersonalProfile
      summary: Render the progressive personal-profile form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible private HTML form that remains usable without JavaScript
          content:
            text/html:
              schema: { type: string }
        '303':
          description: The onboarding session has expired; onboarding cookies are cleared and the browser returns to onboarding
          headers:
            Location:
              required: true
              schema:
                type: string
                const: /onboarding
  /onboarding/plan-selection:
    get:
      operationId: renderOnboardingPlanSelection
      summary: Render the progressive plan-selection form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible private HTML form that remains usable without JavaScript
          content:
            text/html:
              schema: { type: string }
  /onboarding/organization-profile:
    get:
      operationId: renderOnboardingOrganizationProfile
      summary: Render the private progressive organization-profile form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible HTML form usable without JavaScript
          content:
            text/html:
              schema: { type: string }
        '401':
          description: The onboarding continuation is unavailable
          content:
            text/html:
              schema: { type: string }
  /onboarding/discovery:
    get:
      operationId: renderOnboardingDiscovery
      summary: Render the private progressive discovery form
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Accessible HTML form usable without JavaScript
          content:
            text/html:
              schema: { type: string }
        '303':
          description: The continuation is unavailable and the browser returns to onboarding
          headers:
            Location:
              required: true
              schema: { type: string, const: /onboarding }
  /api/onboarding/accounts:
    post:
      operationId: createOnboardingAccount
      summary: Begin email and password onboarding or route an existing account to login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnboardingAccountRequest'
      responses:
        '202':
          description: A new account continues to verification; any existing account continues to login without receiving a verification code or disclosing its verification or journey state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOnboardingAccountResponse'
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      operationId: getHealth
      summary: Report API health
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: Load the current tenant's authenticated dashboard viewer
      security:
        - applicationAccess: []
        - applicationRefresh: []
      responses:
        '200':
          description: Current server-derived viewer identity; a valid refresh credential may be rotated
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            Vary:
              required: true
              description: Includes Cookie because authentication is cookie-derived.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '401':
          description: Generic authentication failure; application cookies are cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/dashboard/logout:
    post:
      operationId: logoutDashboard
      summary: Revoke the current application session and clear its cookies
      description: Accepts no request body. The Origin header must exactly match the configured application origin. Credentials are optional so repeated or cookie-less logout remains idempotent.
      parameters:
        - name: Origin
          in: header
          required: true
          description: Exact trusted application origin used for logout CSRF protection.
          schema:
            type: string
            format: uri
      security:
        - {}
        - applicationAccess: []
        - applicationRefresh: []
      responses:
        '204':
          description: Represented session families are revoked and both HttpOnly, SameSite=Lax application cookies are cleared using their original paths and Secure policy.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
            Set-Cookie:
              required: true
              description: Clears hansel_access at / and hansel_refresh at /api/dashboard.
              schema:
                type: array
                items: { type: string }
        '403':
          description: The Origin header is missing or is not the trusted application origin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: The dashboard rollout boundary is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Session revocation is temporarily unavailable; cookies are retained for retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/sites:
    get:
      operationId: listSites
      summary: Load the authenticated tenant's site list and creation context
      security: [{ applicationAccess: [] }]
      responses:
        '200':
          description: Tenant-scoped site summaries and bounded creation choices
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesPageResponse' }
        '401':
          description: Application authentication is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '404':
          description: Sites is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '503':
          description: Sites is temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
    post:
      operationId: createSite
      summary: Create one tenant-owned site and its initial access atomically
      description: The tenant, organization role, plan, site count, existing members, and internal/external classification are derived by the server. Identical retries under one idempotency key return the original site; changed content conflicts. No Stripe operation occurs.
      parameters:
        - name: Origin
          in: header
          required: true
          description: Exact trusted application origin used for CSRF protection.
          schema: { type: string, format: uri }
      security: [{ applicationAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateSiteRequest'
                - $ref: '#/components/schemas/LegacyCreateSiteRequest'
      responses:
        '201':
          description: Site created or an identical request replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSiteResponse' }
        '400':
          description: Strict request validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '401':
          description: Application authentication is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '403':
          description: Origin or organization authorization failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '409':
          description: Plan limit, paid-seat boundary, or idempotency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '404':
          description: Sites is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '503':
          description: Site creation is temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
  /api/sites/{siteId}:
    get:
      operationId: getSiteActivityContext
      summary: Load the minimal authenticated Activity context for one tenant-owned site
      parameters:
        - name: siteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      security: [{ applicationAccess: [] }]
      responses:
        '200':
          description: Minimal tenant-scoped site context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteActivityResponse' }
        '400':
          description: Site identifier is invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '401':
          description: Application authentication is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '404':
          description: Sites is disabled or the site is unavailable to the authenticated tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
        '503':
          description: Site activity is temporarily unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitesErrorResponse' }
  /api/onboarding/email-verification/verify:
    post:
      operationId: verifyOnboardingEmail
      summary: Verify an initial or eligible onboarding-resumption code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOnboardingEmailRequest'
      responses:
        '200':
          description: A previously unverified account is verified and continues to personal profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOnboardingEmailResponse'
        '400':
          description: Invalid request or generic verification failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/onboarding/email-verification/resend:
    post:
      operationId: resendOnboardingVerification
      summary: Accept an initial or eligible onboarding-resumption code replacement request generically
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOnboardingVerificationRequest'
      responses:
        '202':
          description: Request accepted without revealing account state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOnboardingVerificationResponse'
  /api/onboarding/personal-profile:
    get:
      operationId: getOnboardingPersonalProfile
      summary: Load the verified user's server-authoritative personal profile
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: The accepted profile, or null before the first save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalProfilePageResponse'
        '401':
          description: The onboarding session has expired and onboarding cookies are cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: submitOnboardingPersonalProfile
      summary: Save the verified user's personal profile and advance onboarding
      description: The initial save advances the new-organization journey to plan selection. Returning from plan selection permits an edit, and every accepted write rotates the continuation credential. An unavailable or incompatible continuation is cleared and receives the generic expired-session response; an idempotency key is not accepted for this step.
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for application/json requests and must match the credential-bound CSRF cookie. Native HTML form submissions use that cookie directly.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonalProfileRequest'
      responses:
        '200':
          description: Personal profile saved and plan selection is next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalProfileResponse'
        '303':
          description: Native HTML form submission accepted and continues to plan selection, or an expired session is cleared and returns to onboarding
          headers:
            Location:
              required: true
              schema:
                type: string
                enum:
                  - /onboarding/plan-selection
                  - /onboarding
        '400':
          description: The request does not match the contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
        '401':
          description: The JSON onboarding session has expired and onboarding cookies are cleared, or request authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema: { type: string }
  /api/onboarding/plan-selection:
    get:
      operationId: getOnboardingPlanSelection
      summary: Load the server-authoritative plan catalog and current selection
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Private plan-selection page state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSelectionPageResponse'
        '401':
          description: The onboarding continuation is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The server-authoritative onboarding transition was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: selectOnboardingPlan
      summary: Persist a plan snapshot and advance onboarding
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanSelectionRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/PlanSelectionRequest' }
      responses:
        '200':
          description: Selected plan and server-authored next step
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSelectionResponse' }
        '303': { description: Native form accepted }
        '400': { description: Invalid request }
        '401': { description: Continuation unavailable }
        '409': { description: Transition rejected }
  /api/onboarding/organization-profile:
    get:
      operationId: getOnboardingOrganizationProfile
      summary: Load approved organization taxonomies and a server-issued submission key
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Private organization-profile page state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfilePageResponse'
        '401':
          description: The onboarding continuation is unavailable
        '409':
          description: The server-authoritative onboarding transition was rejected
    post:
      operationId: submitOnboardingOrganizationProfile
      summary: Atomically create the organization and sole Owner membership
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for JSON requests; native forms use the credential-bound CSRF cookie.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationProfileRequest'
      responses:
        '200':
          description: Organization created or an equivalent idempotent replay accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfileResponse'
        '303':
          description: Native form accepted; continue to discovery
        '400': { description: The request does not match the contract }
        '401': { description: The onboarding continuation is unavailable }
        '409': { description: Conflicting replay or rejected transition }
  /api/onboarding/discovery:
    get:
      operationId: getOnboardingDiscovery
      summary: Load approved discovery methods and a server-issued submission key
      security:
        - onboardingContinuation: []
      responses:
        '200':
          description: Private discovery page state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryPageResponse' }
        '401': { description: The onboarding continuation is unavailable }
    post:
      operationId: completeOnboardingDiscovery
      summary: Submit or explicitly skip discovery and complete onboarding
      security:
        - onboardingContinuation: []
          onboardingCsrfCookie: []
      parameters:
        - in: header
          name: X-Hansel-CSRF
          required: false
          description: Required for JSON requests; native forms use the credential-bound CSRF cookie.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoveryRequest' }
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DiscoveryRequest' }
      responses:
        '200':
          description: Onboarding completed or an equivalent idempotent replay accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryResponse' }
        '303':
          description: Native form accepted and redirected to the organization dashboard
          headers:
            Location:
              required: true
              schema: { type: string, const: /dashboard }
        '400': { description: The request does not match the contract }
        '401': { description: The onboarding continuation is unavailable }
        '409': { description: Conflicting replay or rejected transition }
  /api/sites/{siteId}/cover-image:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSiteCoverImage
      description: Private finalized cover bytes for an authenticated Membership with Site visibility, independent of new-upload enablement.
      responses:
        '200':
          description: Verified Site cover Image
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/SitesError' }
        '404': { $ref: '#/components/responses/SitesError' }
        '503': { $ref: '#/components/responses/SitesError' }
  /api/sites/{siteId}/cover-image-uploads:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: startSiteCoverImageUpload
      description: Creator/session-family scoped, idempotent authorization valid for 15 minutes. Requires an exact trusted Origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [idempotencyKey, filename, mediaType, byteSize, checksum]
              properties:
                idempotencyKey: { type: string, format: uuid }
                filename: { type: string, minLength: 1, maxLength: 255 }
                mediaType: { type: string, enum: [image/png, image/jpeg] }
                byteSize: { type: integer, minimum: 1, maximum: 3000000 }
                checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '201': &coverStartResponse
          description: Upload authorization; no storage credentials or keys are disclosed
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [uploadId]
                properties:
                  uploadId: { type: string, format: uuid }
        '200': *coverStartResponse
        '400': { $ref: '#/components/responses/SitesError' }
        '401': { $ref: '#/components/responses/SitesError' }
        '403': { $ref: '#/components/responses/SitesError' }
        '404': { $ref: '#/components/responses/SitesError' }
        '409': { $ref: '#/components/responses/SitesError' }
        '503': { $ref: '#/components/responses/SitesError' }
  /api/sites/{siteId}/cover-image-uploads/{uploadId}/finalize:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: uploadId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: finalizeSiteCoverImageUpload
      description: Verifies the exact authorized bytes, decodes and strips metadata, and persists the cover privately before returning success. Safe to retry with identical bytes.
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary, maxLength: 3000000 }
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 3000000 }
      responses:
        '200':
          description: Cover is durably stored
          headers:
            Cache-Control:
              { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [destination]
                properties:
                  destination:
                    { type: string, pattern: '^/sites/[0-9a-f-]{36}/activity$' }
        '400': { $ref: '#/components/responses/SitesError' }
        '401': { $ref: '#/components/responses/SitesError' }
        '403': { $ref: '#/components/responses/SitesError' }
        '404': { $ref: '#/components/responses/SitesError' }
        '409': { $ref: '#/components/responses/SitesError' }
        '503': { $ref: '#/components/responses/SitesError' }
