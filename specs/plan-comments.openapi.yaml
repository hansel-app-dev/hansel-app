# @spec allocation-plan-comments REQ-001,004..010,012
collection:
  parameters:
    - &a12
      name: siteId
      in: path
      required: true
      schema: &a1
        type: string
        format: uuid
    - &a13
      name: planId
      in: path
      required: true
      schema: *a1
    - &a14
      name: fileId
      in: path
      required: true
      schema:
        type: string
        description: Verified plan file UUID, or legacy for verified legacy content.
  get:
    operationId: listPlanCommentMarkers
    parameters:
      - &a15
        name: cursor
        in: query
        schema:
          type: string
          maxLength: 200
        description: JSON {id,createdAt} cursor from preceding page.
      - name: resolved
        in: query
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Private, no-store response
        content:
          application/json:
            schema:
              type: object
              properties:
                threads:
                  type: array
                  maxItems: 100
                  items: &a4
                    type: object
                    required:
                      - id
                      - fileId
                      - x
                      - y
                      - author
                      - preview
                      - resolved
                      - resolvedAt
                      - resolvedById
                      - createdAt
                      - updatedAt
                    properties:
                      id: *a1
                      fileId:
                        type:
                          - string
                          - 'null'
                        format: uuid
                      x:
                        type: number
                        minimum: 0
                        maximum: 1
                      y:
                        type: number
                        minimum: 0
                        maximum: 1
                      author: &a3
                        type: object
                        required:
                          - id
                          - name
                          - initials
                        properties:
                          id: *a1
                          name:
                            type: string
                          initials:
                            type: string
                      preview:
                        type: string
                      resolved:
                        type: boolean
                      resolvedAt:
                        type:
                          - string
                          - 'null'
                        format: date-time
                      resolvedById:
                        type:
                          - string
                          - 'null'
                        format: uuid
                      createdAt: &a2
                        type: string
                        format: date-time
                      updatedAt: *a2
                nextCursor: &a16
                  type:
                    - object
                    - 'null'
                  properties:
                    id: *a1
                    createdAt: *a2
                viewer: *a3
      '400': &a5
        description: Invalid strict request
      '401': &a6
        description: Session required
      '403': &a7
        description: Exact Origin and COMMENT capability required
      '404': &a8
        description: Inaccessible parent/file/thread or feature disabled
      '409': &a9
        description: Changed-payload replay, resolved reply or stale opposing state
      '422': &a10
        description: Invalid mention, attachment or thread capacity
      '503': &a11
        description: Retryable failure
  post:
    operationId: submitPlanComment
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - idempotencyKey
              - body
              - mentions
              - attachmentIds
              - threadId
              - x
              - y
            properties:
              idempotencyKey:
                type: string
                format: uuid
              body:
                type: string
                maxLength: 5000
              mentions:
                type: array
                maxItems: 20
                items:
                  type: object
                  required:
                    - membershipId
                    - name
                    - start
                    - end
                  properties:
                    membershipId:
                      type: string
                      format: uuid
                    name:
                      type: string
                      maxLength: 200
                    start:
                      type: integer
                      minimum: 0
                    end:
                      type: integer
                      minimum: 1
                  description:
                    Sorted non-overlapping UTF-16 offsets must identify exact @name
                    token. Membership and name revalidated on submit.
              attachmentIds:
                type: array
                maxItems: 5
                uniqueItems: true
                items:
                  type: string
                  format: uuid
              threadId:
                type:
                  - string
                  - 'null'
                format: uuid
              x:
                type:
                  - number
                  - 'null'
                minimum: 0
                maximum: 1
              y:
                type:
                  - number
                  - 'null'
                minimum: 0
                maximum: 1
            description:
              'Root: null threadId and bounded coordinates. Reply: threadId and
              null coordinates. Content limits and attachment claims match
              shared comment contracts; one transaction, stable idempotency
              key.'
    responses:
      '200':
        description: Private, no-store response
        content:
          application/json:
            schema:
              type: object
              properties:
                thread: *a4
                comment:
                  $ref: '#/schemas/Comment'
      '400': *a5
      '401': *a6
      '403': *a7
      '404': *a8
      '409': *a9
      '422': *a10
      '503': *a11
history:
  parameters:
    - *a12
    - *a13
    - *a14
    - name: threadId
      in: path
      required: true
      schema: *a1
  get:
    operationId: readPlanCommentHistory
    parameters:
      - *a15
    responses:
      '200':
        description: Private, no-store response
        content:
          application/json:
            schema:
              type: object
              properties:
                thread: *a4
                comments:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/schemas/Comment'
                nextCursor: *a16
                viewer: *a3
      '400': *a5
      '401': *a6
      '403': *a7
      '404': *a8
      '409': *a9
      '422': *a10
      '503': *a11
state:
  parameters:
    - *a12
    - *a13
    - *a14
    - name: threadId
      in: path
      required: true
      schema: *a1
  put:
    operationId: setPlanCommentResolved
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - resolved
              - expectedUpdatedAt
            properties:
              resolved:
                type: boolean
              expectedUpdatedAt: *a2
    responses:
      '200':
        description: Private, no-store response
        content:
          application/json:
            schema: *a4
      '400': *a5
      '401': *a6
      '403': *a7
      '404': *a8
      '409': *a9
      '422': *a10
      '503': *a11
people:
  parameters:
    - *a12
    - *a13
    - *a14
  get:
    operationId: listSignMentionPeople
    description:
      Requires current session and Site access with COMMENT capability,
      including Viewers. Mutations require exact Origin.
    responses:
      '200':
        description: Success; private, no-store
        content:
          application/json:
            schema:
              type: object
              properties:
                people:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      initials:
                        type: string
                nextCursor:
                  type:
                    - string
                    - 'null'
                  format: uuid
      '400':
        description: Invalid input
      '401':
        description: Session required
      '403':
        description: Origin or access denied
      '404':
        description: Unavailable Sign, resource or feature
      '409':
        description: Idempotency conflict
      '422':
        description: Mention, attachment or verification unavailable
      '503':
        description: Retryable failure
    parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
attachments:
  parameters:
    - *a12
    - *a13
    - *a14
  post:
    operationId: initiatePlanCommentAttachment
    description:
      Requires current session and Site access with COMMENT capability,
      including Viewers. Mutations require exact Origin.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - idempotencyKey
              - filename
              - mediaType
              - byteSize
              - checksumSha256
            properties:
              filename:
                type: string
              mediaType:
                enum:
                  - image/png
                  - image/jpeg
                  - application/pdf
              byteSize:
                type: integer
                minimum: 1
                maximum: 5242880
              idempotencyKey:
                type: string
                format: uuid
              checksumSha256:
                type: string
                pattern: ^[A-Za-z0-9+/]{43}=$
    responses:
      '200':
        description: Success; private, no-store
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                completed:
                  type: boolean
                uploadUrl:
                  type: string
                  format: uri
                headers:
                  type: object
                  additionalProperties:
                    type: string
      '400':
        description: Invalid input
      '401':
        description: Session required
      '403':
        description: Origin or access denied
      '404':
        description: Unavailable Sign, resource or feature
      '409':
        description: Idempotency conflict
      '422':
        description: Mention, attachment or verification unavailable
      '503':
        description: Retryable failure
attachment:
  parameters:
    - *a12
    - *a13
    - *a14
    - name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: verifyPlanCommentAttachment
    description:
      Requires current session and Site access with COMMENT capability,
      including Viewers. Mutations require exact Origin.
    responses:
      '200':
        description: Success; private, no-store
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - filename
                - mediaType
                - byteSize
                - createdAt
              properties:
                id:
                  type: string
                  format: uuid
                filename:
                  type: string
                mediaType:
                  enum:
                    - image/png
                    - image/jpeg
                    - application/pdf
                byteSize:
                  type: integer
                  minimum: 1
                  maximum: 5242880
                createdAt:
                  type: string
                  format: date-time
      '400':
        description: Invalid input
      '401':
        description: Session required
      '403':
        description: Origin or access denied
      '404':
        description: Unavailable Sign, resource or feature
      '409':
        description: Idempotency conflict
      '422':
        description: Mention, attachment or verification unavailable
      '503':
        description: Retryable failure
  delete:
    operationId: discardDraftCommentAttachment
    description:
      Requires current session and Site access with COMMENT capability,
      including Viewers. Mutations require exact Origin.
    responses:
      '200':
        description: Success; private, no-store
        content:
          application/json:
            schema:
              type: object
              properties:
                discarded:
                  const: true
      '400':
        description: Invalid input
      '401':
        description: Session required
      '403':
        description: Origin or access denied
      '404':
        description: Unavailable Sign, resource or feature
      '409':
        description: Idempotency conflict
      '422':
        description: Mention, attachment or verification unavailable
      '503':
        description: Retryable failure
download:
  parameters:
    - *a12
    - *a13
    - *a14
    - name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: downloadPlanCommentAttachment
    description:
      Current Site access required. Unpublished files readable only by
      uploader. Attachment disposition; private no-store; nosniff.
    responses:
      '200':
        description: Original bytes
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      '400':
        description: Invalid input
      '401':
        description: Session required
      '403':
        description: Origin or access denied
      '404':
        description: Unavailable Sign, resource or feature
      '409':
        description: Idempotency conflict
      '422':
        description: Mention, attachment or verification unavailable
      '503':
        description: Retryable failure
thumbnail:
  parameters:
    - *a12
    - *a13
    - *a14
    - name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    operationId: getPlanCommentThumbnail
    description: Same authorization as download. Metadata-free PNG derivative.
    responses:
      '200':
        description: Private PNG
        content:
          image/png:
            schema:
              type: string
              format: binary
      '400':
        description: Invalid input
      '401':
        description: Session required
      '403':
        description: Origin or access denied
      '404':
        description: Unavailable Sign, resource or feature
      '409':
        description: Idempotency conflict
      '422':
        description: Mention, attachment or verification unavailable
      '503':
        description: Retryable failure
schemas:
  Comment:
    type: object
    properties:
      id:
        type: string
        format: uuid
      parentId:
        type:
          - string
          - 'null'
        format: uuid
      body:
        type: string
      author:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          initials:
            type: string
      createdAt:
        type: string
        format: date-time
      mentions:
        type: array
        items:
          type: object
          required:
            - membershipId
            - name
            - start
            - end
          properties:
            membershipId:
              type: string
              format: uuid
            name:
              type: string
              maxLength: 200
            start:
              type: integer
              minimum: 0
            end:
              type: integer
              minimum: 1
          description:
            Sorted non-overlapping UTF-16 offsets must identify exact @name
            token. Membership and name revalidated on submit.
      attachments:
        type: array
        items:
          type: object
          required:
            - id
            - filename
            - mediaType
            - byteSize
            - createdAt
          properties:
            id:
              type: string
              format: uuid
            filename:
              type: string
            mediaType:
              enum:
                - image/png
                - image/jpeg
                - application/pdf
            byteSize:
              type: integer
              minimum: 1
              maximum: 5242880
            createdAt:
              type: string
              format: date-time
      reactions:
        type: array
        items:
          type: object
          properties:
            emoji:
              enum:
                - 👍
                - 👎
                - ❤️
                - 🎉
                - 😄
                - 👀
            selected:
              type: boolean
            count:
              type: integer
              minimum: 1
  Cursor:
    type: object
    required:
      - id
      - createdAt
    properties:
      id:
        type: string
        format: uuid
      createdAt:
        type: string
        format: date-time
