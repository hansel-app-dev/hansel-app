collection:
  parameters:
    - {
        name: siteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: signId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  get:
    operationId: listSignDocuments
    description: Requires current session and Site read access. Private no-store response.
    parameters:
      - { name: cursor, in: query, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Up to 50 completed documents, ordered by ID
        content:
          application/json:
            schema:
              type: object
              required: [documents, nextCursor]
              properties:
                documents: { type: array, items: { $ref: '#/Document' } }
                nextCursor: { type: [string, 'null'], format: uuid }
      '401': { description: No session }
      '404': { description: Unavailable Sign or disabled feature }
      '503': { description: Retryable failure }
  post:
    operationId: initiateSignDocumentUpload
    description: Requires session, exact Origin and MANAGE_SIGNS. Idempotency key binds tenant, Sign, uploader and manifest. Signed PUT expires within 15 minutes.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              [idempotencyKey, filename, mediaType, byteSize, checksumSha256]
            properties:
              idempotencyKey: { type: string, format: uuid }
              filename:
                {
                  type: string,
                  minLength: 1,
                  maxLength: 255,
                  description: No path separators or control characters,
                }
              mediaType:
                { type: string, enum: [image/png, image/jpeg, application/pdf] }
              byteSize: { type: integer, minimum: 1, maximum: 5242880 }
              checksumSha256: { type: string, pattern: '^[A-Za-z0-9+/]{43}=$' }
    responses:
      '200':
        description: Upload intent or completed replay; completed replays omit PUT details
        content:
          application/json:
            schema:
              type: object
              required: [id, completed]
              properties:
                id: { type: string, format: uuid }
                completed: { type: boolean }
                uploadUrl: { type: string, format: uri }
                headers:
                  { type: object, additionalProperties: { type: string } }
      '400': { description: Invalid manifest }
      '401': { description: No session }
      '403': { description: Origin or permission denied }
      '404': { description: Unavailable Sign or disabled feature }
      '409': { description: Idempotency mismatch }
      '422': { description: Expired upload }
      '503': { description: Retryable failure }
item:
  parameters:
    - {
        name: siteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: signId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: documentId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  post:
    operationId: completeSignDocument
    description: Requires session, exact Origin and MANAGE_SIGNS. Verify size, signature and checksum, then atomically make the Document visible. Idempotent replay.
    responses:
      '200':
        description: Verified document
        content: { application/json: { schema: { $ref: '#/Document' } } }
      '401': { description: No session }
      '403': { description: Origin or permission denied }
      '404': { description: Unavailable Sign/document or disabled feature }
      '422': { description: Invalid or expired upload }
      '503': { description: Retryable failure }
download:
  parameters:
    - {
        name: siteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: signId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: documentId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  get:
    operationId: downloadSignDocument
    description: Requires current session and Site access. Original bytes; never inline.
    responses:
      '200':
        description: Private verified bytes
        headers:
          Content-Disposition:
            {
              schema: { type: string },
              description: attachment with safe filename,
            }
          Cache-Control:
            { schema: { type: string, const: 'private, no-store' } }
          X-Content-Type-Options: { schema: { type: string, const: nosniff } }
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      '401': { description: No session }
      '404': { description: Unavailable Sign/document or disabled feature }
      '422': { description: Stored bytes failed verification }
      '503': { description: Retryable failure }
Document:
  type: object
  required: [id, filename, mediaType, byteSize, createdAt]
  properties:
    id: { type: string, format: uuid }
    filename: { type: string }
    mediaType: { type: string, enum: [image/png, image/jpeg, application/pdf] }
    byteSize: { type: integer, minimum: 1, maximum: 5242880 }
    createdAt: { type: string, format: date-time }
