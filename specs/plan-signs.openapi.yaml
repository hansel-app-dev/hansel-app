# allocation-plan-signs REQ-001,007..012; allocation-plan-add-linear REQ-001,004,008,010
collection:
  parameters:
    - {
        name: siteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: planId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  get:
    operationId: loadPlanSigns
    summary: Read canonical signs placed on one file; omit fileId for legacy content
    security: [{ applicationAccess: [] }]
    parameters:
      - { name: fileId, in: query, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Private no-store result, scoped to session tenant and Site Access
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [canManageSigns, signs]
              properties:
                canManageSigns: { type: boolean }
                signs:
                  { type: array, maxItems: 5000, items: { $ref: '#/sign' } }
      '400': { description: Invalid identifiers }
      '401': { description: Authentication required }
      '404': { description: Feature disabled or inaccessible plan/file }
      '503': { description: Temporarily unavailable }
  post:
    operationId: createPlanSign
    summary: Atomically create a Sign and placement; requires MANAGE_SIGNS and exact Origin
    description: Tenant-scoped idempotency key retries return the same Sign. Changed payload conflicts. Generated Site-wide code is editable; defaults to Plan signs group and Directional Function. Legacy stored Wayfinder values are read as Directional. Linear placements require distinct endpoints and Safety Decal, default to Orange and Regulatory/Statutory, and receive Site-unique Pr.01-style codes.
    security: [{ applicationAccess: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [fileId, x, y, idempotencyKey]
            allOf:
              - if:
                  properties: { placementKind: { const: linear } }
                  required: [placementKind]
                then:
                  required: [endX, endY, mounting]
                  properties:
                    endX: { type: number, minimum: 0, maximum: 1 }
                    endY: { type: number, minimum: 0, maximum: 1 }
                    mounting: { const: Safety Decal }
                else:
                  properties:
                    endX: { type: 'null' }
                    endY: { type: 'null' }
            properties:
              placementKind: { enum: [point, linear], default: point }
              endX: { type: [number, 'null'], minimum: 0, maximum: 1 }
              endY: { type: [number, 'null'], minimum: 0, maximum: 1 }
              fileId: { type: [string, 'null'], format: uuid }
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
              idempotencyKey: { type: string, format: uuid }
              mounting:
                {
                  enum:
                    [
                      Freestanding,
                      Wall-mounted,
                      Overhead,
                      Cantilevered,
                      Floor,
                      Safety Decal,
                      Privacy Decal,
                      Environmental,
                    ],
                  default: Wall-mounted,
                }
    responses:
      '201':
        {
          description: Saved canonical Sign; private no-store,
          content: { application/json: { schema: { $ref: '#/sign' } } },
        }
      '400': { description: Invalid strict request }
      '401': { description: Authentication required }
      '403': { description: Permission or Origin rejected }
      '404': { description: Feature disabled or inaccessible plan/file }
      '409':
        {
          description: Idempotency conflict,
          code conflict or allowance reached,
        }
      '503':
        { description: Temporarily unavailable; retry the same idempotency key }
item:
  parameters:
    - {
        name: siteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: planId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: signId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  patch:
    operationId: updatePlanSign
    description: Placement kind is immutable. Linear geometry updates require all four bounded coordinates and distinct endpoints; Linear Type/Colour are fixed Safety Decal/Orange. Point Colour remains Red. Geometry and shared Sign timestamp update atomically.
    summary: Update shared Sign with updatedAt concurrency; MANAGE_SIGNS and exact Origin required
    security: [{ applicationAccess: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 2
            dependentRequired:
              { x: [y], y: [x], endX: [x, y, endY], endY: [x, y, endX] }
            required: [expectedUpdatedAt]
            properties:
              expectedUpdatedAt: { type: string, format: date-time }
              endX: { type: number, minimum: 0, maximum: 1 }
              endY: { type: number, minimum: 0, maximum: 1 }
              x: { type: number, minimum: 0, maximum: 1 }
              y: { type: number, minimum: 0, maximum: 1 }
              code: { type: string, minLength: 1, maxLength: 40 }
              content: { type: string, maxLength: 200 }
              mounting:
                {
                  enum:
                    [
                      Freestanding,
                      Wall-mounted,
                      Overhead,
                      Cantilevered,
                      Floor,
                      Safety Decal,
                      Privacy Decal,
                      Environmental,
                    ],
                }
              function:
                {
                  enum:
                    [
                      Identification,
                      Directional,
                      Informational,
                      Regulatory/Statutory,
                    ],
                }
              colour: { enum: [Red, Orange] }
              orientation:
                {
                  enum:
                    [
                      left,
                      up-left,
                      up,
                      up-right,
                      right,
                      down-right,
                      down,
                      down-left,
                    ],
                }
    responses:
      '200':
        {
          description: Updated canonical Sign; private no-store,
          content: { application/json: { schema: { $ref: '#/sign' } } },
        }
      '400': { description: Invalid strict request }
      '401': { description: Authentication required }
      '403': { description: Permission or Origin rejected }
      '404': { description: Feature disabled or inaccessible Sign }
      '409':
        {
          description: Stale updatedAt or duplicate code; reload before editing,
        }
      '503': { description: Temporarily unavailable }
  delete:
    operationId: deletePlanSign
    summary: Delete selected shared Sign and placement, including schedule entry; no undo
    description: Requires MANAGE_SIGNS and exact Origin. Does not remove other Signs, the group or plan files.
    security: [{ applicationAccess: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedUpdatedAt]
            properties:
              expectedUpdatedAt: { type: string, format: date-time }
    responses:
      '200':
        {
          description: Removed from both views; private no-store,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [deleted],
                      additionalProperties: false,
                      properties: { deleted: { const: true } },
                    },
                },
            },
        }
      '400': { description: Invalid strict request }
      '401': { description: Authentication required }
      '403': { description: Permission or Origin rejected }
      '404': { description: Feature disabled or inaccessible Sign }
      '409': { description: Stale updatedAt; reload before deleting }
      '503': { description: Temporarily unavailable }
sign:
  type: object
  additionalProperties: false
  required:
    [
      id,
      fileId,
      x,
      y,
      code,
      content,
      updatedAt,
      mounting,
      function,
      colour,
      orientation,
    ]
  allOf:
    - if:
        properties: { placementKind: { const: linear } }
        required: [placementKind]
      then:
        required: [endX, endY]
        properties:
          endX: { type: number, minimum: 0, maximum: 1 }
          endY: { type: number, minimum: 0, maximum: 1 }
          mounting: { const: Safety Decal }
          colour: { const: Orange }
      else:
        properties:
          endX: { type: 'null' }
          endY: { type: 'null' }
          colour: { const: Red }
  properties:
    placementKind: { enum: [point, linear] }
    endX: { type: [number, 'null'], minimum: 0, maximum: 1 }
    endY: { type: [number, 'null'], minimum: 0, maximum: 1 }
    id: { type: string, format: uuid }
    fileId: { type: [string, 'null'], format: uuid }
    x: { type: number, minimum: 0, maximum: 1 }
    y: { type: number, minimum: 0, maximum: 1 }
    code: { type: string, minLength: 1, maxLength: 40 }
    content: { type: string, maxLength: 200 }
    updatedAt: { type: string, format: date-time }
    mounting:
      {
        enum:
          [
            Freestanding,
            Wall-mounted,
            Overhead,
            Cantilevered,
            Floor,
            Safety Decal,
            Privacy Decal,
            Environmental,
          ],
      }
    function:
      {
        enum:
          [Identification, Directional, Informational, Regulatory/Statutory],
      }
    colour: { enum: [Red, Orange] }
    orientation:
      {
        enum: [left, up-left, up, up-right, right, down-right, down, down-left],
      }
