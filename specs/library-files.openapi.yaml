# @spec library-files REQ-003..012
collection:
  get:
    operationId: listLibraryFiles
    description: Current session and source Site Access required. Same Organization only. Private no-store response. Latest upload first, ID ascending for equal dates; at most 50 files per page.
    parameters:
      - {
          name: q,
          in: query,
          schema: { type: string, maxLength: 200, default: '' },
        }
      - {
          name: kind,
          in: query,
          schema: { type: string, enum: [all, image, pdf], default: all },
        }
      - { name: cursor, in: query, schema: { type: string, format: uuid } }
    responses:
      '200':
        description: Accessible immutable files, without storage keys or signed URLs
        content:
          application/json:
            schema:
              type: object
              required: [files, nextCursor]
              properties:
                files:
                  {
                    type: array,
                    maxItems: 50,
                    items: { $ref: '#/LibraryFile' },
                  }
                nextCursor: { type: [string, 'null'], format: uuid }
      '400': { description: Invalid query }
      '401': { description: No session }
      '403': { description: Membership revoked }
      '404': { description: Unavailable cursor or disabled feature }
      '503': { description: Retryable failure }
download:
  parameters: &fileParameters
    - {
        name: fileId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  get:
    operationId: downloadLibraryFile
    description: Rechecks current source Site Access and original size, SHA-256 and signature. Private no-store attachment response; no storage URL is exposed.
    responses:
      '200':
        description: Original bytes with original filename
        content:
          application/pdf: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      '401': { description: No session }
      '403': { description: Membership revoked }
      '404': { description: Unavailable file or disabled feature }
      '503': { description: Retryable failure }
thumbnail:
  parameters: *fileParameters
  get:
    operationId: thumbnailLibraryFile
    description: Current source Site Access required. Private no-store PNG thumbnail; unavailable until generated or supplied by the original Photo upload.
    responses:
      '200':
        description: Thumbnail bytes
        content:
          image/png: { schema: { type: string, format: binary } }
      '401': { description: No session }
      '403': { description: Membership revoked }
      '404': { description: Unavailable file, thumbnail or disabled feature }
      '503': { description: Retryable failure }
plans:
  parameters:
    - {
        name: siteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  post:
    operationId: createLibraryAllocationPlan
    description: Exact Origin, current Owner/Administrator and target Site Access required. Rechecks source Site Access. Creates an independent named plan/file link without copying annotations or Signs. Request key binds Organization, uploader, target and input.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [idempotencyKey, fileId, name]
            properties:
              idempotencyKey: { type: string, format: uuid }
              fileId: { type: string, format: uuid }
              name:
                {
                  type: string,
                  minLength: 1,
                  maxLength: 200,
                  description: Trimmed NFC name with no control characters,
                }
    responses:
      '200':
        description: Created plan or original idempotent result
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  { $ref: './openapi.yaml#/components/schemas/AllocationPlan' }
      '400': { description: Invalid selection or name }
      '401': { description: No session }
      '403': { description: Wrong Origin or insufficient current role }
      '404': { description: Unavailable source or target; disabled feature }
      '409': { description: Idempotency key reused with different input }
      '503': { description: Retryable failure }
documents:
  parameters: &signParameters
    - {
        name: siteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    - {
        name: signId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  post:
    operationId: attachLibraryDocuments
    description: Exact Origin, MANAGE_SIGNS and target Site Access required. Source Site Access rechecked for each selected file. Creates independent completed Document links to original bytes. Existing same-Sign same-kind links are deduplicated.
    requestBody: &selectionBody
      required: true
      content:
        application/json:
          schema: { $ref: '#/Selection' }
    responses:
      '200':
        description: Original result for repeated key and identical payload
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  {
                    type: array,
                    items: { $ref: './sign-documents.openapi.yaml#/Document' },
                  }
      '400': { description: Invalid selection }
      '401': { description: No session }
      '403': { description: Wrong Origin or insufficient current role }
      '404': { description: Unavailable source or target; disabled feature }
      '409': { description: Idempotency key reused with different input }
      '503': { description: Retryable failure }
photos:
  parameters: *signParameters
  post:
    operationId: attachLibraryPhotos
    description: Exact Origin, MANAGE_SIGNS and target Site Access required. Source Site Access rechecked for each selected file; PNG/JPEG only. Generates a bounded PNG thumbnail if missing. Creates independent Photo links to original bytes; duplicates within this Sign are reused.
    requestBody: *selectionBody
    responses:
      '200':
        description: Original result for repeated key and identical payload
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  {
                    type: array,
                    items: { $ref: './sign-photos.openapi.yaml#/Photo' },
                  }
      '400': { description: Invalid selection }
      '401': { description: No session }
      '403': { description: Wrong Origin or insufficient current role }
      '404': { description: Unavailable source or target; disabled feature }
      '409': { description: PDF selected or key reused with different input }
      '503': { description: Retryable failure }
Selection:
  type: object
  additionalProperties: false
  required: [idempotencyKey, fileIds]
  properties:
    idempotencyKey: { type: string, format: uuid }
    fileIds:
      {
        type: array,
        minItems: 1,
        maxItems: 50,
        uniqueItems: true,
        items: { type: string, format: uuid },
      }
LibraryFile:
  type: object
  additionalProperties: false
  required:
    [
      id,
      filename,
      mediaType,
      byteSize,
      uploadedBy,
      createdAt,
      sourceSite,
      hasThumbnail,
    ]
  properties:
    id: { type: string, format: uuid }
    filename: { type: string, minLength: 1, maxLength: 255 }
    mediaType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
    byteSize: { type: integer, minimum: 1, maximum: 5242880 }
    uploadedBy: { type: string }
    createdAt: { type: string, format: date-time }
    sourceSite:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    hasThumbnail: { type: boolean }
